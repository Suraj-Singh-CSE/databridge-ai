[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databridge-ai-service"
version = "0.0.0"
description = "DataBridge AI internal service: profiling, mapping, entity resolution, SQL agent, RAG."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Suraj Singh" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "structlog>=24.1",
  "httpx>=0.27",
  "google-genai>=1.30",
  "redis>=5.2",
  "pymongo>=4.10",
  "celery[redis]>=5.4",
  "polars>=2.1",
  "fastexcel>=0.21",
  "xlsxwriter>=3.2",
  "duckdb>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "fakeredis>=2.26",
  "mongomock>=4.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "httpx>=0.27",
  "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["py.typed"]
"app.mapping" = ["prompts/*.txt"]
"app.matching" = ["prompts/*.txt"]
"app.sql" = ["prompts/*.txt"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort
  "B",       # bugbear
  "UP",      # pyupgrade
  "N",       # pep8-naming
  "S",       # bandit (security)
  "SIM",     # simplify
  "RUF",     # ruff-specific
  "ANN",     # type annotations
  "PT",      # pytest style
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# SQL tests build query text on purpose (it runs only in the sandbox or the validator).
"tests/test_sql_*.py" = ["S101", "S608"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

# Celery, kombu and xlsxwriter ship no type information.
[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "xlsxwriter", "xlsxwriter.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["app"]
