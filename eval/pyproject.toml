[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbeval"
version = "0.1.0"
description = "DataBridge AI evaluation: deterministic ground-truth data generator with answer keys."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Suraj Singh" }]
# faker and xlsxwriter are pinned exactly: the same seed must produce byte-identical files, and
# a new Faker release can change its name lists. Bump them together with a regenerated sample.
dependencies = [
  "faker==40.63.0",
  "xlsxwriter==3.3.3",
  "openpyxl>=3.1",
  "polars>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-openpyxl>=3.1",
]

[tool.setuptools.packages.find]
include = ["dbeval*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
extend-exclude = ["data", "samples"]

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort
  "B",       # bugbear
  "UP",      # pyupgrade
  "N",       # pep8-naming
  "S",       # bandit (security)
  "SIM",     # simplify
  "RUF",     # ruff-specific
  "ANN",     # type annotations
  "PT",      # pytest style
]

[tool.ruff.lint.isort]
known-first-party = ["dbeval"]

[tool.ruff.lint.per-file-ignores]
# S311: the generator needs a seeded, reproducible PRNG, not a cryptographic one.
"dbeval/**" = ["S311"]
"tests/**" = ["S101", "S311"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["dbeval"]

# xlsxwriter ships no type information (no py.typed, no stubs package).
[[tool.mypy.overrides]]
module = ["xlsxwriter"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=dbeval --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["dbeval"]
