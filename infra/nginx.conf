# nginx config for the web image (local compose only): serve the SPA and proxy /api/ to the api.
# Free hosting has no nginx: the api serves the SPA itself (docs/adr/0027-same-origin-and-access.md).
# Note: add_header in a location replaces (not merges) server-level headers, so the security
# headers are repeated in every location that sets its own headers.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Browser -> api. "api" is the compose service name; ai-service is never routed here.
    location /api/ {
        # File uploads: the API enforces 50 MB per file; nginx allows a little more so the API,
        # not nginx, returns the clear PAYLOAD_TOO_LARGE error. Stream uploads instead of
        # buffering them to disk, and allow slow uploads/long requests.
        client_max_body_size 55m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live job progress (Server-Sent Events). A regex location wins over the /api/ prefix above.
    # Responses must reach the browser as they are written: no buffering or caching, and a long
    # read timeout (the api sends a keep-alive comment every 15 s and ends the stream itself).
    location ~ ^/api/v1/jobs/[^/]+/events$ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths load index.html so client-side routing works.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Same policy as the api sends in single-origin mode (apps/api/src/security-headers.ts).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
