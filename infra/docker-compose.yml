# DataBridge AI full stack for local development and CI.
#   cp .env.example .env        # then edit the secrets
#   docker compose --env-file .env -f infra/docker-compose.yml up --build
#
# Free-hosting layout instead (MinIO for Cloudflare R2, no shared volume, the worker inside the
# ai-service container; docs/adr/0026-free-tier-runtime.md): add -f infra/docker-compose.s3.yml.
#
# Values come from the env file passed with --env-file (compose does not read the repo-root .env
# on its own because this file lives in infra/). Each service receives only the variables it needs.
# Secrets use ${VAR:?...} so compose refuses to start when one is missing.
#
# Published to the host: web (8080, nginx proxying /api) and api (4000). The api also serves the
# built web app itself (SERVE_WEB=true): http://localhost:4000 is the single-origin layout used on
# free hosting, with its CSP (docs/adr/0027-same-origin-and-access.md). Either URL works locally.
# ai-service, ai-worker, mongo and redis are reachable only on the private compose network.
name: databridge

# Settings shared by ai-service (HTTP, enqueues jobs) and ai-worker (Celery, runs them).
x-ai-environment: &ai-environment
  AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN in your env file}
  # "production" hides /internal/docs and refuses demo routes and tokens under 32 characters.
  ENV: ${ENV:-development}
  MONGODB_URI: mongodb://mongo:27017/databridge
  REDIS_URL: redis://redis:6379/0
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
  GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
  # Shared by ai-service and ai-worker through Redis (ADR 0028).
  LLM_MAX_REQUESTS_PER_MINUTE: ${LLM_MAX_REQUESTS_PER_MINUTE:-12}
  LLM_DAILY_REQUEST_BUDGET: ${LLM_DAILY_REQUEST_BUDGET:-400}
  LLM_PROJECT_DAILY_REQUEST_BUDGET: ${LLM_PROJECT_DAILY_REQUEST_BUDGET:-0}
  LLM_DAILY_BUDGET_RESET_TIMEZONE: ${LLM_DAILY_BUDGET_RESET_TIMEZONE:-America/Los_Angeles}
  LLM_QUOTA_STORE: ${LLM_QUOTA_STORE:-redis}
  LLM_RETRY_AFTER_MAX_SECONDS: ${LLM_RETRY_AFTER_MAX_SECONDS:-60}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  UPLOAD_DIR: /data/uploads
  # Object storage (docs/adr/0026-free-tier-runtime.md): the same variables as the api.
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
  # Column profiler limits (docs/adr/0011-column-profiling.md), shared with the api.
  MAX_UPLOAD_ROWS: ${MAX_UPLOAD_ROWS:-200000}
  XLSX_MAX_UNCOMPRESSED_BYTES: ${XLSX_MAX_UNCOMPRESSED_BYTES:-209715200}
  XLSX_MAX_COMPRESSION_RATIO: ${XLSX_MAX_COMPRESSION_RATIO:-100}
  # Background jobs (docs/adr/0010-background-jobs.md).
  JOB_SOFT_TIME_LIMIT_SECONDS: ${JOB_SOFT_TIME_LIMIT_SECONDS:-900}
  JOB_HARD_TIME_LIMIT_SECONDS: ${JOB_HARD_TIME_LIMIT_SECONDS:-960}
  JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
  JOB_RETRY_BACKOFF_SECONDS: ${JOB_RETRY_BACKOFF_SECONDS:-2}
  JOB_RETRY_BACKOFF_MAX_SECONDS: ${JOB_RETRY_BACKOFF_MAX_SECONDS:-60}
  # Column mapping (docs/adr/0012-column-mapping.md).
  MAPPING_LLM_ENABLED: ${MAPPING_LLM_ENABLED:-true}
  MAPPING_TEMPERATURE: ${MAPPING_TEMPERATURE:-0}
  MAPPING_MAX_OUTPUT_TOKENS: ${MAPPING_MAX_OUTPUT_TOKENS:-4096}
  MAPPING_MAX_COLUMNS_PER_CALL: ${MAPPING_MAX_COLUMNS_PER_CALL:-40}
  # Candidate pairs (docs/adr/0015-blocking.md).
  BLOCKING_MAX_BLOCK_SIZE: ${BLOCKING_MAX_BLOCK_SIZE:-200}
  MATCHING_MAX_RECORDS: ${MATCHING_MAX_RECORDS:-1000000}
  MATCHING_MAX_PAIRS: ${MATCHING_MAX_PAIRS:-5000000}
  # Pair scoring (docs/adr/0016-pair-scoring.md).
  SCORING_MATCH_THRESHOLD: ${SCORING_MATCH_THRESHOLD:-0.90}
  SCORING_MAYBE_THRESHOLD: ${SCORING_MAYBE_THRESHOLD:-0.50}
  SCORING_MODEL: ${SCORING_MODEL:-em}
  # AI review of maybe pairs (docs/adr/0017-ai-pair-review.md).
  PAIR_REVIEW_LLM_ENABLED: ${PAIR_REVIEW_LLM_ENABLED:-true}
  PAIR_REVIEW_PAIRS_PER_CALL: ${PAIR_REVIEW_PAIRS_PER_CALL:-10}
  PAIR_REVIEW_CONFIDENCE_THRESHOLD: ${PAIR_REVIEW_CONFIDENCE_THRESHOLD:-0.8}
  PAIR_REVIEW_TEMPERATURE: ${PAIR_REVIEW_TEMPERATURE:-0}
  PAIR_REVIEW_MAX_OUTPUT_TOKENS: ${PAIR_REVIEW_MAX_OUTPUT_TOKENS:-4096}
  # Clusters and golden records (docs/adr/0018-clusters-and-golden-records.md).
  CLUSTERING_INCLUDE_AI_SUGGESTED: ${CLUSTERING_INCLUDE_AI_SUGGESTED:-true}
  CLUSTERING_MAX_CLUSTER_SIZE: ${CLUSTERING_MAX_CLUSTER_SIZE:-6}
  SURVIVORSHIP_SOURCE_TRUST: ${SURVIVORSHIP_SOURCE_TRUST:-crm,billing,support}
  # Export of golden records (docs/adr/0020-export.md).
  EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-200000}
  # SQL agent (docs/adr/0021-sql-agent.md).
  SQL_AGENT_LLM_ENABLED: ${SQL_AGENT_LLM_ENABLED:-true}
  SQL_AGENT_MAX_REPAIRS: ${SQL_AGENT_MAX_REPAIRS:-2}
  SQL_AGENT_TEMPERATURE: ${SQL_AGENT_TEMPERATURE:-0}
  SQL_AGENT_MAX_OUTPUT_TOKENS: ${SQL_AGENT_MAX_OUTPUT_TOKENS:-4096}
  SQL_STATEMENT_TIMEOUT_SECONDS: ${SQL_STATEMENT_TIMEOUT_SECONDS:-20}
  SQL_MEMORY_LIMIT_MB: ${SQL_MEMORY_LIMIT_MB:-512}
  SQL_THREADS: ${SQL_THREADS:-2}
  SQL_MAX_RECORDS: ${SQL_MAX_RECORDS:-200000}
  QUALITY_FRESHNESS_WARN_HOURS: ${QUALITY_FRESHNESS_WARN_HOURS:-24}
  QUALITY_FRESHNESS_FAIL_HOURS: ${QUALITY_FRESHNESS_FAIL_HOURS:-168}
  QUALITY_ROW_CHANGE_WARN_PERCENT: ${QUALITY_ROW_CHANGE_WARN_PERCENT:-20}
  QUALITY_HISTORY_LIMIT: ${QUALITY_HISTORY_LIMIT:-50}
  # Knowledge index for the project assistant (docs/adr/0024-knowledge-index.md). The image sets
  # KNOWLEDGE_DOCS_DIR itself (the README and ADRs it ships).
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
  KNOWLEDGE_EMBEDDINGS_ENABLED: ${KNOWLEDGE_EMBEDDINGS_ENABLED:-true}
  KNOWLEDGE_QUALITY_RUNS: ${KNOWLEDGE_QUALITY_RUNS:-5}
  # Project assistant answers (docs/adr/0025-assistant.md).
  ASSISTANT_TOP_K: ${ASSISTANT_TOP_K:-8}
  ASSISTANT_MIN_TERM_OVERLAP: ${ASSISTANT_MIN_TERM_OVERLAP:-0.6}
  ASSISTANT_HISTORY_TURNS: ${ASSISTANT_HISTORY_TURNS:-4}
  ASSISTANT_TEMPERATURE: ${ASSISTANT_TEMPERATURE:-0}
  ASSISTANT_MAX_OUTPUT_TOKENS: ${ASSISTANT_MAX_OUTPUT_TOKENS:-1024}
  ASSISTANT_GUARD_CACHE_SECONDS: ${ASSISTANT_GUARD_CACHE_SECONDS:-60}

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  ai-service:
    build:
      context: ..
      dockerfile: apps/ai-service/Dockerfile
    restart: unless-stopped
    environment: *ai-environment
    volumes:
      # Uploaded source files, written by the api. Read-only here (the profiler runs in ai-worker).
      - uploads:/data/uploads:ro
    # No "ports": reachable only as http://ai-service:8000 inside the compose network.
    expose:
      - '8000'
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery worker: runs background jobs (column profiling, ...). Same image as ai-service.
  ai-worker:
    build:
      context: ..
      dockerfile: apps/ai-service/Dockerfile
    restart: unless-stopped
    command:
      [
        'celery',
        '-A',
        'app.worker.celery_app:celery_app',
        'worker',
        '--loglevel=INFO',
        '--concurrency=2',
        '--hostname=worker@%h',
      ]
    environment: *ai-environment
    # Same uid/gid as the api's non-root "node" user (1000), so the export job can write its
    # files under projects/<id>/exports/ in the folders the api created, and the api can
    # stream and delete them (docs/adr/0020-export.md). Still not root.
    user: '1000:1000'
    volumes:
      # Read-write for exports only; uploaded originals are only read (ADR 0009, ADR 0020).
      - uploads:/data/uploads
    # Not published and listens on no port: it only talks to redis and mongo.
    healthcheck:
      # Replaces the image's HTTP check: asks this worker to answer a ping over the broker.
      test:
        [
          'CMD-SHELL',
          'celery -A app.worker.celery_app:celery_app inspect ping --destination "worker@$$HOSTNAME" --timeout 5 > /dev/null',
        ]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 20s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '4000'
      MONGODB_URI: mongodb://mongo:27017/databridge
      REDIS_URL: redis://redis:6379/0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in your env file}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in your env file}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN in your env file}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-5000}
      AI_SERVICE_WAKE_TIMEOUT_MS: ${AI_SERVICE_WAKE_TIMEOUT_MS:-90000}
      ASSISTANT_TIMEOUT_MS: ${ASSISTANT_TIMEOUT_MS:-30000}
      ASSISTANT_RATE_LIMIT_MAX: ${ASSISTANT_RATE_LIMIT_MAX:-5}
      ASSISTANT_RATE_LIMIT_WINDOW_MS: ${ASSISTANT_RATE_LIMIT_WINDOW_MS:-60000}
      ASSISTANT_MAX_TURNS: ${ASSISTANT_MAX_TURNS:-50}
      # Background jobs (docs/adr/0010-background-jobs.md).
      JOB_STALE_AFTER_SECONDS: ${JOB_STALE_AFTER_SECONDS:-300}
      JOB_QUEUED_STALE_AFTER_SECONDS: ${JOB_QUEUED_STALE_AFTER_SECONDS:-600}
      JOB_EVENTS_KEEPALIVE_MS: ${JOB_EVENTS_KEEPALIVE_MS:-15000}
      # Data retention for the free tier (docs/adr/0029-concurrency-and-retention.md).
      JOB_RETENTION_DAYS: ${JOB_RETENTION_DAYS:-30}
      LLM_CALL_RETENTION_DAYS: ${LLM_CALL_RETENTION_DAYS:-30}
      ASSISTANT_RETENTION_DAYS: ${ASSISTANT_RETENTION_DAYS:-30}
      EXPORT_RETENTION_DAYS: ${EXPORT_RETENTION_DAYS:-30}
      QUALITY_RUN_RETENTION_DAYS: ${QUALITY_RUN_RETENTION_DAYS:-90}
      AUDIT_MAX_ENTRIES_PER_PROJECT: ${AUDIT_MAX_ENTRIES_PER_PROJECT:-20000}
      RETENTION_SWEEP_INTERVAL_MINUTES: ${RETENTION_SWEEP_INTERVAL_MINUTES:-60}
      # Default quality thresholds, shown in the thresholds dialog (the worker applies them).
      QUALITY_FRESHNESS_WARN_HOURS: ${QUALITY_FRESHNESS_WARN_HOURS:-24}
      QUALITY_FRESHNESS_FAIL_HOURS: ${QUALITY_FRESHNESS_FAIL_HOURS:-168}
      QUALITY_ROW_CHANGE_WARN_PERCENT: ${QUALITY_ROW_CHANGE_WARN_PERCENT:-20}
      # The browser origin is the nginx web container, not the Vite dev server.
      CORS_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      # Number of proxy hops to trust for the client IP (rate limiting). See .env.example.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Rate-limit counters shared through Redis (ADR 0028).
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-redis}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      SESSION_RATE_LIMIT_MAX: ${SESSION_RATE_LIMIT_MAX:-120}
      SESSION_RATE_LIMIT_WINDOW_MS: ${SESSION_RATE_LIMIT_WINDOW_MS:-900000}
      # Access control (docs/adr/0027-same-origin-and-access.md).
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      REGISTRATION_INVITE_CODES: ${REGISTRATION_INVITE_CODES:-}
      # Same-origin web app: the image ships the build in WEB_DIST_DIR.
      SERVE_WEB: ${SERVE_WEB:-true}
      # File uploads (ADR 0009). Local disk on the shared "uploads" volume by default.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /data/uploads
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      MAX_UPLOAD_ROWS: ${MAX_UPLOAD_ROWS:-200000}
      XLSX_MAX_UNCOMPRESSED_BYTES: ${XLSX_MAX_UNCOMPRESSED_BYTES:-209715200}
      XLSX_MAX_COMPRESSION_RATIO: ${XLSX_MAX_COMPRESSION_RATIO:-100}
      MAX_SOURCES_PER_PROJECT: ${MAX_SOURCES_PER_PROJECT:-10}
      UPLOAD_RATE_LIMIT_MAX: ${UPLOAD_RATE_LIMIT_MAX:-30}
      UPLOAD_RATE_LIMIT_WINDOW_MS: ${UPLOAD_RATE_LIMIT_WINDOW_MS:-3600000}
    volumes:
      - uploads:/data/uploads
    ports:
      - '4000:4000'
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
  redis-data:
  # Uploaded files and exports: read-write for api and ai-worker (exports), read-only for
  # ai-service.
  uploads:
