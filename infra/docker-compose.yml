# DataBridge AI full stack for local development and CI.
#   cp .env.example .env        # then edit the secrets
#   docker compose --env-file .env -f infra/docker-compose.yml up --build
#
# Values come from the env file passed with --env-file (compose does not read the repo-root .env
# on its own because this file lives in infra/). Each service receives only the variables it needs.
# Secrets use ${VAR:?...} so compose refuses to start when one is missing.
#
# Published to the host: web (8080) and api (4000) only.
# ai-service, ai-worker, mongo and redis are reachable only on the private compose network.
name: databridge

# Settings shared by ai-service (HTTP, enqueues jobs) and ai-worker (Celery, runs them).
x-ai-environment: &ai-environment
  AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN in your env file}
  MONGODB_URI: mongodb://mongo:27017/databridge
  REDIS_URL: redis://redis:6379/0
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
  GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
  # Per process: ai-service and ai-worker each pace separately (ADR 0013).
  LLM_MAX_REQUESTS_PER_MINUTE: ${LLM_MAX_REQUESTS_PER_MINUTE:-12}
  LLM_RETRY_AFTER_MAX_SECONDS: ${LLM_RETRY_AFTER_MAX_SECONDS:-60}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  UPLOAD_DIR: /data/uploads
  # Column profiler limits (docs/adr/0011-column-profiling.md), shared with the api.
  MAX_UPLOAD_ROWS: ${MAX_UPLOAD_ROWS:-200000}
  XLSX_MAX_UNCOMPRESSED_BYTES: ${XLSX_MAX_UNCOMPRESSED_BYTES:-209715200}
  XLSX_MAX_COMPRESSION_RATIO: ${XLSX_MAX_COMPRESSION_RATIO:-100}
  # Background jobs (docs/adr/0010-background-jobs.md).
  JOB_SOFT_TIME_LIMIT_SECONDS: ${JOB_SOFT_TIME_LIMIT_SECONDS:-900}
  JOB_HARD_TIME_LIMIT_SECONDS: ${JOB_HARD_TIME_LIMIT_SECONDS:-960}
  JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
  JOB_RETRY_BACKOFF_SECONDS: ${JOB_RETRY_BACKOFF_SECONDS:-2}
  JOB_RETRY_BACKOFF_MAX_SECONDS: ${JOB_RETRY_BACKOFF_MAX_SECONDS:-60}
  # Column mapping (docs/adr/0012-column-mapping.md).
  MAPPING_LLM_ENABLED: ${MAPPING_LLM_ENABLED:-true}
  MAPPING_TEMPERATURE: ${MAPPING_TEMPERATURE:-0}
  MAPPING_MAX_OUTPUT_TOKENS: ${MAPPING_MAX_OUTPUT_TOKENS:-4096}
  MAPPING_MAX_COLUMNS_PER_CALL: ${MAPPING_MAX_COLUMNS_PER_CALL:-40}

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  ai-service:
    build:
      context: ..
      dockerfile: apps/ai-service/Dockerfile
    restart: unless-stopped
    environment: *ai-environment
    volumes:
      # Uploaded source files, written by the api. Read-only here (the profiler runs in ai-worker).
      - uploads:/data/uploads:ro
    # No "ports": reachable only as http://ai-service:8000 inside the compose network.
    expose:
      - '8000'
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery worker: runs background jobs (column profiling, ...). Same image as ai-service.
  ai-worker:
    build:
      context: ..
      dockerfile: apps/ai-service/Dockerfile
    restart: unless-stopped
    command:
      [
        'celery',
        '-A',
        'app.worker.celery_app:celery_app',
        'worker',
        '--loglevel=INFO',
        '--concurrency=2',
        '--hostname=worker@%h',
      ]
    environment: *ai-environment
    volumes:
      - uploads:/data/uploads:ro
    # Not published and listens on no port: it only talks to redis and mongo.
    healthcheck:
      # Replaces the image's HTTP check: asks this worker to answer a ping over the broker.
      test:
        [
          'CMD-SHELL',
          'celery -A app.worker.celery_app:celery_app inspect ping --destination "worker@$$HOSTNAME" --timeout 5 > /dev/null',
        ]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 20s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '4000'
      MONGODB_URI: mongodb://mongo:27017/databridge
      REDIS_URL: redis://redis:6379/0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in your env file}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in your env file}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN in your env file}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-5000}
      # Background jobs (docs/adr/0010-background-jobs.md).
      JOB_STALE_AFTER_SECONDS: ${JOB_STALE_AFTER_SECONDS:-300}
      JOB_EVENTS_KEEPALIVE_MS: ${JOB_EVENTS_KEEPALIVE_MS:-15000}
      # The browser origin is the nginx web container, not the Vite dev server.
      CORS_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      # Number of proxy hops to trust for the client IP (rate limiting). See .env.example.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      # File uploads (ADR 0009). Local disk on the shared "uploads" volume by default.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /data/uploads
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      MAX_UPLOAD_ROWS: ${MAX_UPLOAD_ROWS:-200000}
      XLSX_MAX_UNCOMPRESSED_BYTES: ${XLSX_MAX_UNCOMPRESSED_BYTES:-209715200}
      XLSX_MAX_COMPRESSION_RATIO: ${XLSX_MAX_COMPRESSION_RATIO:-100}
      MAX_SOURCES_PER_PROJECT: ${MAX_SOURCES_PER_PROJECT:-10}
      UPLOAD_RATE_LIMIT_MAX: ${UPLOAD_RATE_LIMIT_MAX:-30}
      UPLOAD_RATE_LIMIT_WINDOW_MS: ${UPLOAD_RATE_LIMIT_WINDOW_MS:-3600000}
    volumes:
      - uploads:/data/uploads
    ports:
      - '4000:4000'
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
  redis-data:
  # Uploaded files: read-write for api, read-only for ai-service and ai-worker.
  uploads:
