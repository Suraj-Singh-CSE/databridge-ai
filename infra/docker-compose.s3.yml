# Free-hosting layout (docs/adr/0026-free-tier-runtime.md), used by CI:
#   docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.s3.yml up --build
#
# - An S3-compatible server stands in for Cloudflare R2 (moto's S3 server: the MinIO image is no
#   longer available on Docker Hub): STORAGE_DRIVER=s3 for api and ai-service, and NO shared
#   uploads volume, so nothing works unless every file goes through the bucket. Its data lives
#   in memory and is gone when the container stops.
# - The Celery worker runs inside the ai-service container (RUN_WORKER=true, one job at a time),
#   as on a free web service; the separate ai-worker service is not started.
# The env file must set S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY (any values for the test
# server; real R2 keys in production). The S3 server is not published to the host.
name: databridge

x-s3-environment: &s3-environment
  STORAGE_DRIVER: s3
  S3_BUCKET: databridge-uploads
  S3_REGION: us-east-1
  S3_ENDPOINT: http://s3:5000
  S3_FORCE_PATH_STYLE: 'true'
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in your env file}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in your env file}

services:
  s3:
    image: motoserver/moto:latest
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/moto-api/', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the private bucket once (like creating the R2 bucket in the dashboard), then exits.
  storage-init:
    build:
      context: ..
      dockerfile: apps/ai-service/Dockerfile
    restart: 'no'
    environment: *s3-environment
    command:
      - python
      - -c
      - |
        import os
        import boto3
        from botocore.config import Config
        from botocore.exceptions import ClientError
        client = boto3.client(
            "s3",
            endpoint_url=os.environ["S3_ENDPOINT"],
            region_name=os.environ["S3_REGION"],
            aws_access_key_id=os.environ["S3_ACCESS_KEY_ID"],
            aws_secret_access_key=os.environ["S3_SECRET_ACCESS_KEY"],
            config=Config(s3={"addressing_style": "path"}),
        )
        bucket = os.environ["S3_BUCKET"]
        try:
            client.head_bucket(Bucket=bucket)
            print(f"bucket {bucket} exists")
        except ClientError:
            client.create_bucket(Bucket=bucket)
            print(f"bucket {bucket} created")
    depends_on:
      s3:
        condition: service_healthy

  ai-service:
    environment:
      <<: *s3-environment
      RUN_WORKER: 'true'
      WORKER_POOL: prefork
      WORKER_CONCURRENCY: '1'
    volumes: !reset []
    depends_on:
      storage-init:
        condition: service_completed_successfully

  # Not started: the worker runs inside ai-service. `--profile split-worker` would start it.
  ai-worker:
    profiles: ['split-worker']
    environment: *s3-environment
    volumes: !reset []

  api:
    environment: *s3-environment
    volumes: !reset []
    depends_on:
      storage-init:
        condition: service_completed_successfully
