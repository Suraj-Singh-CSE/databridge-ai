name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: JS (web + api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real MongoDB and Redis for the api's DB-backed and job event tests. With CI=true they
    # fail instead of skipping.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MONGODB_URI: mongodb://localhost:27017/databridge_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Test web
        run: npm test --workspace apps/web
      - name: Test api with coverage (unit + in-memory + MongoDB suites)
        run: npm run test:coverage --workspace apps/api
      - name: Build api and web
        run: npm run build --workspace apps/api --workspace apps/web

  python:
    name: Python (ai-service)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real Redis (broker + pub/sub) and MongoDB for the in-process Celery worker test.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_MONGODB_URI: mongodb://localhost:27017/databridge_test
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ai-service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest

  eval:
    name: Python (eval generator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            eval/pyproject.toml
            apps/ai-service/pyproject.toml
      # The mapping evaluation imports the ai-service's engine (pure functions, no services).
      - run: pip install -e ../apps/ai-service -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  docker:
    name: Docker (full stack smoke test)
    needs: [js, python]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The free-hosting layout (ADR 0026): an S3 test server (Cloudflare R2 in production), no shared
      # uploads volume, and the Celery worker inside the ai-service container.
      COMPOSE: docker compose --env-file .env.ci -f infra/docker-compose.yml -f infra/docker-compose.s3.yml
      # The container whose logs hold the worker's lines.
      WORKER_SERVICE: ai-service
    steps:
      - uses: actions/checkout@v7

      - name: Create CI env file with throwaway random secrets
        run: |
          secret() { openssl rand -base64 48 | tr -d '\n/+='; }
          {
            echo "JWT_ACCESS_SECRET=$(secret)"
            echo "JWT_REFRESH_SECRET=$(secret)"
            echo "AI_SERVICE_TOKEN=$(secret)"
            # S3 keys for api and ai-service (the test server accepts any).
            echo "S3_ACCESS_KEY_ID=ci$(openssl rand -hex 8)"
            echo "S3_SECRET_ACCESS_KEY=$(secret)"
            echo "LLM_PROVIDER=mock"
            echo "LOG_LEVEL=INFO"
            # The e2e suite signs in and out several times from one IP (the nginx proxy).
            echo "AUTH_RATE_LIMIT_MAX=200"
            echo "SESSION_RATE_LIMIT_MAX=2000"
            # Only this account becomes admin (ADR 0027); the smoke tests register it first.
            echo "BOOTSTRAP_ADMIN_EMAIL=smoke@example.com"
            # Production hardening of the ai-service: no /internal/docs, no demo routes.
            echo "ENV=production"
          } > .env.ci

      - name: Validate compose file
        run: $COMPOSE config --quiet

      - name: Build images
        run: $COMPOSE build

      - name: Start stack and wait for health checks
        run: $COMPOSE up -d --wait --wait-timeout 180

      - name: Show image sizes and container status
        run: |
          docker image ls 'databridge-*'
          $COMPOSE ps

      - name: Smoke test
        run: |
          set -euo pipefail
          check() {
            local url=$1 code
            code=$(curl -s -o /tmp/body -w '%{http_code}' --retry 5 --retry-all-errors --retry-delay 2 "$url")
            echo "$url -> $code $(head -c 200 /tmp/body)"
            test "$code" = 200
          }
          check http://localhost:8080/
          check http://localhost:8080/some/client/route   # SPA fallback
          check http://localhost:4000/api/v1/health
          check http://localhost:8080/api/v1/health       # through the nginx proxy
          grep -q '"service":"api"' /tmp/body
          # Readiness: the api pings MongoDB and Redis; the ai-service also its object storage.
          check http://localhost:4000/api/v1/ready
          jq -e '.data.checks == {"mongodb": "ok", "redis": "ok"}' /tmp/body > /dev/null
          $COMPOSE exec -T api node -e '
            fetch("http://ai-service:8000/internal/v1/ready")
              .then(async (r) => { console.log(r.status, JSON.stringify(await r.json())); process.exit(r.ok ? 0 : 1); })
              .catch((e) => { console.error(e.message); process.exit(1); });' > /tmp/ai-ready
          cat /tmp/ai-ready
          grep -q '"storage":"ok"' /tmp/ai-ready
          # ENV=production: the ai-service serves no API docs.
          $COMPOSE exec -T api node -e '
            Promise.all(["/internal/docs", "/internal/openapi.json"].map((p) => fetch("http://ai-service:8000" + p)))
              .then((rs) => { const codes = rs.map((r) => r.status); console.log("ai-service docs:", codes); process.exit(codes.every((c) => c === 404) ? 0 : 1); })
              .catch((e) => { console.error(e.message); process.exit(1); });'
          # The Celery worker runs inside the ai-service container (no separate worker service).
          $COMPOSE exec -T ai-service celery -A app.worker.celery_app:celery_app inspect ping --timeout 10
          echo "ok: api and ai-service ready, worker running beside uvicorn"

      - name: Single-origin smoke test (the api serves the web app, ADR 0027)
        run: |
          set -euo pipefail
          origin=http://localhost:4000
          for path in / /projects /projects/abc/mapping; do
            curl -sS -D /tmp/headers -o /tmp/page "$origin$path"
            echo "$path -> $(head -n 1 /tmp/headers | tr -d '\r')"
            grep -q '<div id="root">' /tmp/page
            grep -qi '^cache-control: no-cache' /tmp/headers
            grep -qi "^content-security-policy: default-src 'self';script-src 'self';" /tmp/headers
            grep -qi "frame-ancestors 'none'" /tmp/headers
            grep -qi '^permissions-policy: ' /tmp/headers
          done
          asset=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/page | head -n 1)
          curl -sS -D /tmp/headers -o /dev/null "$origin$asset"
          echo "$asset -> $(grep -i '^cache-control' /tmp/headers | tr -d '\r')"
          grep -qi '^cache-control: public, max-age=31536000, immutable' /tmp/headers
          code=$(curl -s -o /tmp/body -w '%{http_code}' "$origin/api/v1/no-such-route")
          echo "/api/v1/no-such-route -> $code $(cat /tmp/body)"
          test "$code" = 404
          jq -e '.error.code == "NOT_FOUND"' /tmp/body > /dev/null
          curl -sf "$origin/api/v1/auth/config" | jq -e '.data.registrationMode == "open"' > /dev/null
          echo "ok: one origin for the web app and the API, with CSP and caching headers"

      - name: Auth smoke test through the nginx proxy (register, then /me)
        run: |
          set -euo pipefail
          body=$(curl -sf -X POST http://localhost:8080/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","name":"Smoke","password":"smoke-test-password"}')
          echo "$body" | jq -e '.data.user.role == "admin"' > /dev/null
          # Any other registrant is not admin, even early on (BOOTSTRAP_ADMIN_EMAIL only).
          curl -sf -X POST http://localhost:8080/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"second@example.com","name":"Second","password":"smoke-test-password"}' \
            | jq -e '.data.user.role == "data_engineer"' > /dev/null
          token=$(echo "$body" | jq -r '.data.accessToken')
          curl -sf http://localhost:8080/api/v1/auth/me -H "Authorization: Bearer $token" \
            | jq -e '.data.user.email == "smoke@example.com"'

      - name: Upload smoke test through the nginx proxy (sources)
        run: |
          set -euo pipefail
          api=http://localhost:8080/api/v1
          token=$(curl -sS --fail-with-body -X POST "$api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-test-password"}' | jq -r '.data.accessToken')
          auth="Authorization: Bearer $token"
          project=$(curl -sS --fail-with-body -X POST "$api/projects" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"name":"Smoke uploads"}' | jq -r '.data.project.id')
          sources="$api/projects/$project/sources"
          echo "project $project"

          csv=$(curl -sS --fail-with-body -X POST "$sources" -H "$auth" \
            -F "file=@eval/samples/crm_customers.csv;type=text/csv" -F name=CRM -F systemName=CRM)
          echo "upload crm_customers.csv -> $(echo "$csv" | jq -c '.data.source | {id, name, format, sizeBytes, rowCount, columnCount, status}')"
          echo "$csv" | jq -e '.data.source.rowCount == 143 and .data.source.columnCount == 10' > /dev/null
          csv_id=$(echo "$csv" | jq -r '.data.source.id')

          xlsx=$(curl -sS --fail-with-body -X POST "$sources" -H "$auth" \
            -F "file=@eval/samples/billing_export.xlsx" -F systemName=Billing)
          echo "upload billing_export.xlsx -> $(echo "$xlsx" | jq -c '.data.source | {id, name, format, sizeBytes, rowCount}')"
          xlsx_id=$(echo "$xlsx" | jq -r '.data.source.id')

          list=$(curl -sS --fail-with-body "$sources" -H "$auth")
          echo "list -> $(echo "$list" | jq -c '[.data.items[] | {name, format, rowCount}]')"
          echo "$list" | jq -e --arg id "$csv_id" \
            '.data.items | map(select(.id == $id and .rowCount == 143)) | length == 1' > /dev/null

          preview=$(curl -sS --fail-with-body "$sources/$csv_id/preview?limit=3" -H "$auth")
          echo "preview csv -> columns $(echo "$preview" | jq -c '.data.columns'), $(echo "$preview" | jq '.data.rows | length') rows"
          echo "$preview" | jq -e '.data.columns[0] == "cust_id" and (.data.rows | length) == 3' > /dev/null
          preview=$(curl -sS --fail-with-body "$sources/$xlsx_id/preview?limit=3" -H "$auth")
          echo "preview xlsx -> columns $(echo "$preview" | jq -c '.data.columns'), $(echo "$preview" | jq '.data.rows | length') rows"
          echo "$preview" | jq -e '.data.columns[0] == "CustomerID" and (.data.rows | length) == 3' > /dev/null

          printf 'MZ not really a program' > /tmp/setup.exe
          code=$(curl -sS -o /tmp/reject -w '%{http_code}' -X POST "$sources" -H "$auth" -F "file=@/tmp/setup.exe")
          echo "upload setup.exe -> $code $(cat /tmp/reject)"
          test "$code" = 400
          jq -e '.error.code == "UNSUPPORTED_FILE"' /tmp/reject > /dev/null

          # Stored in the bucket (the S3 test server here, R2 in production), not on any shared disk: the
          # ai-service sees the object through its own S3 client, and the api wrote no local file.
          key="projects/$project/sources/$csv_id/original.csv"
          $COMPOSE exec -T ai-service python -c '
          import sys
          from app.config import get_settings
          from app.storage import create_storage
          storage = create_storage(get_settings())
          with storage.download(sys.argv[1], max_bytes=1 << 20) as path:
              print("ai-service reads header:", path.read_text().splitlines()[0])
          ' "$key"
          if $COMPOSE exec -T api test -e "/data/uploads/projects/$project"; then
            echo "the api must not write uploads to local disk with STORAGE_DRIVER=s3" >&2
            exit 1
          fi
          echo "ok: upload stored in the bucket only"

      - name: Jobs smoke test through the nginx proxy (demo job, live progress, fail, cancel)
        run: |
          set -euo pipefail
          api=http://localhost:8080/api/v1
          token=$(curl -sS --fail-with-body -X POST "$api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-test-password"}' | jq -r '.data.accessToken')
          auth="Authorization: Bearer $token"
          project=$(curl -sS --fail-with-body -X POST "$api/projects" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"name":"Smoke jobs"}' | jq -r '.data.project.id')

          start_job() {
            curl -sS --fail-with-body -X POST "$api/projects/$project/jobs" -H "$auth" \
              -H 'Content-Type: application/json' -d "$1" | jq -r '.data.job.id'
          }
          # Reads the SSE stream until the api ends it (after a terminal status); 60 s at most.
          watch_job() {
            curl -sSN --fail --max-time 60 "$api/jobs/$1/events" -H "$auth" > "/tmp/sse-$1"
            sed -n 's/^data: //p' "/tmp/sse-$1" > "/tmp/frames-$1"
          }
          summary() { jq -r '"\(.status) \(.progress)%"' "/tmp/frames-$1" | paste -sd ',' -; }

          job=$(start_job '{"type":"demo","payload":{"steps":5,"stepMs":200}}')
          watch_job "$job"
          echo "demo $job events: $(summary "$job")"
          grep -q '^event: job$' "/tmp/sse-$job"
          jq -s -e '
            (last | .status == "succeeded" and .progress == 100 and .result.steps == 5)
            and ([.[].progress] as $p | $p == ($p | sort))
            and ([.[] | select(.status == "running") | .progress] | unique | length) >= 2
          ' "/tmp/frames-$job" > /dev/null
          echo "ok: demo job succeeded with increasing progress"

          job=$(start_job '{"type":"demo","payload":{"steps":3,"stepMs":100,"failAtStep":2}}')
          watch_job "$job"
          echo "failing demo $job events: $(summary "$job"), error $(jq -c 'select(.error) | .error' "/tmp/frames-$job")"
          jq -s -e 'last | .status == "failed" and .error.code == "DEMO_STEP_FAILED"' "/tmp/frames-$job" > /dev/null
          echo "ok: failAtStep job failed with the handler's code"

          job=$(start_job '{"type":"demo","payload":{"steps":20,"stepMs":500}}')
          watch_job "$job" &
          watcher=$!
          for _ in $(seq 1 50); do
            progress=$(curl -sS --fail-with-body "$api/jobs/$job" -H "$auth" | jq -r '.data.job.progress')
            [ "$progress" -gt 0 ] && break
            sleep 0.2
          done
          cancel=$(curl -sS --fail-with-body -X POST "$api/jobs/$job/cancel" -H "$auth")
          echo "cancel $job at ${progress}% -> $(echo "$cancel" | jq -c '.data.job | {status, progress}')"
          wait "$watcher"
          echo "cancelled demo $job events: $(summary "$job")"
          jq -s -e 'last.status == "cancelled"' "/tmp/frames-$job" > /dev/null
          sleep 2   # the worker stops at its next step and must not move the job any more
          after=$(curl -sS --fail-with-body "$api/jobs/$job" -H "$auth" | jq -c '.data.job | {status, progress}')
          echo "after 2 s: $after"
          echo "$after" | jq -e --argjson p "$(echo "$cancel" | jq '.data.job.progress')" \
            '.status == "cancelled" and .progress == $p' > /dev/null
          # The worker stops either at its cancel check or when its next progress write is refused.
          $COMPOSE logs --no-color "$WORKER_SERVICE" > /tmp/worker.log
          grep -E '"event": "job_(started|succeeded|failed|cancelled|no_longer_active)"' /tmp/worker.log | tail -n 8
          grep -F "\"jobId\": \"$job\"" /tmp/worker.log | grep -qE 'job_(cancelled|no_longer_active)'
          echo "ok: cancelled job stopped in the worker"

      - name: Profile smoke test through the nginx proxy (CSV and XLSX, masked values)
        run: |
          set -euo pipefail
          api=http://localhost:8080/api/v1
          token=$(curl -sS --fail-with-body -X POST "$api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-test-password"}' | jq -r '.data.accessToken')
          auth="Authorization: Bearer $token"
          project=$(curl -sS --fail-with-body -X POST "$api/projects" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"name":"Smoke profiles"}' | jq -r '.data.project.id')
          sources="$api/projects/$project/sources"

          profile() {
            local file=$1 source job
            source=$(curl -sS --fail-with-body -X POST "$sources" -H "$auth" -F "file=@$file" | jq -r '.data.source.id')
            job=$(curl -sS --fail-with-body -X POST "$api/projects/$project/jobs" -H "$auth" \
              -H 'Content-Type: application/json' \
              -d "{\"type\":\"profile\",\"payload\":{\"sourceId\":\"$source\"}}" | jq -r '.data.job.id')
            curl -sSN --fail --max-time 90 "$api/jobs/$job/events" -H "$auth" | sed -n 's/^data: //p' > "/tmp/profile-$job"
            echo "$file job $job: $(jq -r '"\(.status) \(.progress)% \(.message)"' "/tmp/profile-$job" | paste -sd ',' -)" >&2
            jq -s -e 'last | .status == "succeeded"' "/tmp/profile-$job" > /dev/null
            curl -sS --fail-with-body "$sources/$source/profile" -H "$auth" > "/tmp/profile-body-$source"
            echo "$source"
          }

          csv=$(profile eval/samples/crm_customers.csv)
          jq -c '.data.source | {status, rowCount, columnCount}' "/tmp/profile-body-$csv"
          jq -c '[.data.columns[] | {column, inferredType}]' "/tmp/profile-body-$csv"
          jq -e '.data.source.status == "profiled" and .data.source.rowCount == 143
            and (.data.columns | length) == 10
            and (.data.columns[] | select(.column == "ph") | .inferredType) == "phone"
            and (.data.columns[] | select(.column == "email_id") | .samples[0]) == "[EMAIL]"' \
            "/tmp/profile-body-$csv" > /dev/null
          # No raw value of the first CRM row reaches the profile.
          for value in "Rudra Shroff" 6376476497 rudra_s860@example.net 14/12/1975; do
            if grep -qF "$value" "/tmp/profile-body-$csv"; then echo "raw value in profile" >&2; exit 1; fi
          done

          xlsx=$(profile eval/samples/billing_export.xlsx)
          jq -c '.data.source | {status, rowCount, columnCount}' "/tmp/profile-body-$xlsx"
          jq -e '.data.source.rowCount == 151 and .data.source.columnCount == 9
            and (.data.columns[] | select(.column == "PAN") | .patterns[0].code) == "pan"' \
            "/tmp/profile-body-$xlsx" > /dev/null
          echo "ok: CSV and XLSX profiled by the worker from the object storage"

      - name: Mapping smoke test through the nginx proxy (profile, then map the CRM sample)
        run: |
          set -euo pipefail
          api=http://localhost:8080/api/v1
          token=$(curl -sS --fail-with-body -X POST "$api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-test-password"}' | jq -r '.data.accessToken')
          auth="Authorization: Bearer $token"
          project=$(curl -sS --fail-with-body -X POST "$api/projects" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"name":"Smoke mapping"}' | jq -r '.data.project.id')
          source=$(curl -sS --fail-with-body -X POST "$api/projects/$project/sources" -H "$auth" \
            -F "file=@eval/samples/crm_customers.csv" | jq -r '.data.source.id')

          run_job() {
            local type=$1 job
            job=$(curl -sS --fail-with-body -X POST "$api/projects/$project/jobs" -H "$auth" \
              -H 'Content-Type: application/json' \
              -d "{\"type\":\"$type\",\"payload\":{\"sourceId\":\"$source\"}}" | jq -r '.data.job.id')
            curl -sSN --fail --max-time 90 "$api/jobs/$job/events" -H "$auth" | sed -n 's/^data: //p' > "/tmp/$type-$job"
            echo "$type job $job: $(jq -r '"\(.status) \(.progress)% \(.message)"' "/tmp/$type-$job" | paste -sd ',' -)"
            jq -s -e 'last | .status == "succeeded"' "/tmp/$type-$job" > /dev/null
            jq -s -c 'last | .result' "/tmp/$type-$job"
          }

          run_job profile
          run_job mapping
          curl -sS --fail-with-body "$api/projects/$project/sources/$source/mappings" -H "$auth" > /tmp/mappings
          jq -c '[.data.columns[] | {column, target: .suggestion.target, role: .suggestion.role, label: .suggestion.confidenceLabel}]' /tmp/mappings
          jq -e '(.data.columns | length) == 10 and .data.run.method == "hybrid"
            and (.data.columns[] | select(.column == "email_id") | .suggestion
              | .target == "email" and .confidenceLabel == "High")
            and (.data.columns[] | select(.column == "cust_id") | .suggestion.role) == "source_record_id"' \
            /tmp/mappings > /dev/null
          # Bulk-accept the High suggestions, then a second column onto "email" is refused.
          curl -sS --fail-with-body -X POST "$api/projects/$project/sources/$source/mappings/accept-high" \
            -H "$auth" | jq -e '.data.accepted > 0' > /dev/null
          code=$(curl -s -o /tmp/conflict -w '%{http_code}' -X PATCH \
            "$api/projects/$project/sources/$source/mappings/gender" -H "$auth" \
            -H 'Content-Type: application/json' \
            -d '{"decision":"override","role":"field","target":"email"}')
          test "$code" = 409
          # No raw value of the first CRM row reaches the suggestions.
          for value in "Rudra Shroff" 6376476497 rudra_s860@example.net 14/12/1975; do
            if grep -qF "$value" /tmp/mappings; then echo "raw value in mappings" >&2; exit 1; fi
          done
          echo "ok: profile then mapping; email_id -> email (High)"

      - name: Standardise smoke test through the nginx proxy (map, review, standardise the CRM sample)
        run: |
          set -euo pipefail
          api=http://localhost:8080/api/v1
          token=$(curl -sS --fail-with-body -X POST "$api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-test-password"}' | jq -r '.data.accessToken')
          auth="Authorization: Bearer $token"
          project=$(curl -sS --fail-with-body -X POST "$api/projects" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"name":"Smoke standardise"}' | jq -r '.data.project.id')
          source=$(curl -sS --fail-with-body -X POST "$api/projects/$project/sources" -H "$auth" \
            -F "file=@eval/samples/crm_customers.csv" | jq -r '.data.source.id')
          mappings="$api/projects/$project/sources/$source/mappings"

          run_job() {
            local type=$1 job
            job=$(curl -sS --fail-with-body -X POST "$api/projects/$project/jobs" -H "$auth" \
              -H 'Content-Type: application/json' \
              -d "{\"type\":\"$type\",\"payload\":{\"sourceId\":\"$source\"}}" | jq -r '.data.job.id')
            curl -sSN --fail --max-time 90 "$api/jobs/$job/events" -H "$auth" | sed -n 's/^data: //p' > "/tmp/$type-$job"
            echo "$type job $job: $(jq -r '"\(.status) \(.progress)% \(.message)"' "/tmp/$type-$job" | paste -sd ',' -)"
            jq -s -e 'last | .status == "succeeded"' "/tmp/$type-$job" > /dev/null
            jq -s -c 'last | .result' "/tmp/$type-$job" | tee /tmp/last-result
          }

          run_job profile
          run_job mapping
          curl -sS --fail-with-body -X POST "$mappings/accept-high" -H "$auth" | jq -c '.data'

          # Refused early while columns are still pending.
          code=$(curl -s -o /tmp/refused -w '%{http_code}' -X POST "$api/projects/$project/jobs" -H "$auth" \
            -H 'Content-Type: application/json' -d "{\"type\":\"standardise\",\"payload\":{\"sourceId\":\"$source\"}}")
          echo "standardise before review -> $code $(jq -c '.error | {code, details}' /tmp/refused)"
          test "$code" = 409
          jq -e '.error.details.reason == "MAPPING_NOT_APPROVED"' /tmp/refused > /dev/null

          # The phone column must be used; every other pending column is rejected.
          curl -sS --fail-with-body "$mappings" -H "$auth" > /tmp/mappings
          if jq -e '.data.columns[] | select(.column == "ph") | .status == "pending"' /tmp/mappings > /dev/null; then
            curl -sS --fail-with-body -X PATCH "$mappings/ph" -H "$auth" -H 'Content-Type: application/json' \
              -d '{"decision":"override","role":"field","target":"phone","transform":"to_e164_in"}' > /dev/null
          fi
          for column in $(jq -r '.data.columns[] | select(.status == "pending" and .column != "ph") | .column' /tmp/mappings); do
            curl -sS --fail-with-body -X PATCH "$mappings/$column" -H "$auth" \
              -H 'Content-Type: application/json' -d '{"decision":"reject"}' > /dev/null
          done
          curl -sS --fail-with-body "$mappings" -H "$auth" \
            | jq -c '[.data.columns[] | {column, status, target: (.decision.target // .suggestion.target)}]'

          run_job standardise
          jq -e '.rowCount == 143' /tmp/last-result > /dev/null

          staged="$api/projects/$project/sources/$source/staged"
          curl -sS --fail-with-body "$staged?limit=100" -H "$auth" > /tmp/staged
          # Counts and formats only: no staged value is printed.
          jq -c '{summary: .data.summary | {rowCount, rowsWithIssues, issues}, rows: (.data.items | length), nextCursor: .data.nextCursor}' /tmp/staged
          jq -e '.data.source.status == "standardised" and .data.summary.rowCount == 143
            and (.data.items | length) == 100 and .data.nextCursor == "100"
            and ([.data.items[] | .fields.phone | select(. != null)] | length) > 80
            and all(.data.items[] | .fields.phone | select(. != null); test("^\\+91[6-9][0-9]{9}$"))
            and all(.data.items[]; .sourceRecordId != null)' /tmp/staged > /dev/null
          curl -sS --fail-with-body "$staged?limit=100&cursor=100" -H "$auth" \
            | jq -e '(.data.items | length) == 43 and .data.nextCursor == null' > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' "$staged?limit=101" -H "$auth")
          test "$code" = 400
          echo "ok: reviewed mapping applied to all 143 rows; phones are E.164"

          # Candidate pairs: a project-level job (payload {}) over every standardised source.
          job=$(curl -sS --fail-with-body -X POST "$api/projects/$project/jobs" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"type":"candidates","payload":{}}' | jq -r '.data.job.id')
          curl -sSN --fail --max-time 90 "$api/jobs/$job/events" -H "$auth" | sed -n 's/^data: //p' > "/tmp/candidates-$job"
          echo "candidates job $job: $(jq -r '"\(.status) \(.progress)% \(.message)"' "/tmp/candidates-$job" | paste -sd ',' -)"
          jq -s -e 'last | .status == "succeeded" and .result.recordCount == 143' "/tmp/candidates-$job" > /dev/null
          candidates="$api/projects/$project/candidates"
          curl -sS --fail-with-body "$candidates/summary" -H "$auth" > /tmp/candidates-summary
          jq -c '.data | {outdated, summary: .summary | {recordCount, pairCount, reductionRatio, oversizeBlocksSkipped, pairsByKey}}' /tmp/candidates-summary
          jq -e '.data.outdated == false and .data.summary.recordCount == 143
            and .data.summary.pairCount > 0 and .data.summary.reductionRatio > 0.99' /tmp/candidates-summary > /dev/null
          curl -sS --fail-with-body "$candidates?limit=100" -H "$auth" > /tmp/candidates
          # Shape and formats only: no record value is printed.
          jq -c '{pairs: (.data.items | length), keys: [.data.items[].keys], nextCursor: .data.nextCursor}' /tmp/candidates
          jq -e '(.data.items | length) > 0
            and all(.data.items[]; (.keys | length) > 0 and .recordA.id < .recordB.id
              and .recordA.sourceName == "crm_customers" and (.recordA.fields | type) == "object"
              and (.recordB.fields.phone == null or (.recordB.fields.phone | test("^\\+91[6-9][0-9]{9}$"))))' \
            /tmp/candidates > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' "$candidates?limit=101" -H "$auth")
          test "$code" = 400
          echo "ok: candidate pairs found and listed side by side"

          # Pair scoring: a project-level job (payload {}) over the current candidate pairs.
          job=$(curl -sS --fail-with-body -X POST "$api/projects/$project/jobs" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"type":"scoring","payload":{}}' | jq -r '.data.job.id')
          curl -sSN --fail --max-time 90 "$api/jobs/$job/events" -H "$auth" | sed -n 's/^data: //p' > "/tmp/scoring-$job"
          echo "scoring job $job: $(jq -r '"\(.status) \(.progress)% \(.message)"' "/tmp/scoring-$job" | paste -sd ',' -)"
          jq -s -e 'last | .status == "succeeded"' "/tmp/scoring-$job" > /dev/null
          pairs=$(jq -r '.data.summary.pairCount' /tmp/candidates-summary)
          scores="$api/projects/$project/scores"
          curl -sS --fail-with-body "$scores/summary" -H "$auth" > /tmp/scores-summary
          jq -c '.data | {outdated, summary: .summary | {pairCount, bandCounts, thresholds, model: .model | {method, fallbackReason, emIterations}}}' /tmp/scores-summary
          jq -e --argjson pairs "$pairs" '.data.outdated == false and .data.summary.pairCount == $pairs
            and ([.data.summary.bandCounts[].count] | add) == $pairs' /tmp/scores-summary > /dev/null
          curl -sS --fail-with-body "$scores?band=match&limit=100" -H "$auth" > /tmp/scores
          # Bands, scores and reason texts only: no record value is printed.
          jq -c '{matches: (.data.items | length), reasons: [.data.items[].reasons[].text] | unique}' /tmp/scores
          jq -e '(.data.items | length) > 0
            and all(.data.items[]; .band == "match" and .score >= 0.9 and (.reasons | length) > 0
              and .recordA.id < .recordB.id and (.recordA.fields | type) == "object")' /tmp/scores > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' "$scores?band=maybe-not" -H "$auth")
          test "$code" = 400
          echo "ok: candidate pairs scored, bands sum to the pairs, matches carry reasons"

          # AI review of maybe pairs (Mock provider in CI): runs when there are maybe pairs,
          # else the api refuses with 409 NO_MAYBE_PAIRS. Suggestions never change the band.
          maybe=$(jq -r '[.data.summary.bandCounts[] | select(.band == "maybe") | .count] | add // 0' /tmp/scores-summary)
          if [ "$maybe" -gt 0 ]; then
            job=$(curl -sS --fail-with-body -X POST "$api/projects/$project/jobs" -H "$auth" \
              -H 'Content-Type: application/json' -d '{"type":"pair_review","payload":{}}' | jq -r '.data.job.id')
            curl -sSN --fail --max-time 90 "$api/jobs/$job/events" -H "$auth" | sed -n 's/^data: //p' > "/tmp/review-$job"
            echo "pair_review job $job: $(jq -r '"\(.status) \(.progress)% \(.message)"' "/tmp/review-$job" | paste -sd ',' -)"
            jq -s -e 'last | .status == "succeeded"' "/tmp/review-$job" > /dev/null
            curl -sS --fail-with-body "$scores/summary" -H "$auth" > /tmp/review-summary
            jq -c '.data.summary.aiReview | {reviewed, same, different, unsure, unavailable, model, promptVersion}' /tmp/review-summary
            jq -e --argjson maybe "$maybe" '.data.summary.aiReview.pairCount == $maybe
              and (.data.summary.aiReview | .reviewed + .unavailable) == $maybe' /tmp/review-summary > /dev/null
            curl -sS --fail-with-body "$scores?band=maybe&limit=100" -H "$auth" > /tmp/review-items
            # Decisions and reasons only: no record value is printed.
            jq -c '[.data.items[] | {aiStatus, aiDecision, aiConfidence, suggestedBand, aiReason}]' /tmp/review-items
            jq -e 'all(.data.items[]; .band == "maybe" and (.aiStatus == "reviewed" or .aiStatus == "unavailable")
              and .aiPromptVersion == "pair_review.v1" and .reviewedAt != null
              and (.suggestedBand | IN("match", "maybe", "non_match")))' /tmp/review-items > /dev/null
            echo "ok: maybe pairs reviewed by the AI, suggestions stored beside the scores"
          else
            curl -sS -X POST "$api/projects/$project/jobs" -H "$auth" -H 'Content-Type: application/json' \
              -d '{"type":"pair_review","payload":{}}' > /tmp/review-refused
            jq -c '.error | {code, reason: .details.reason}' /tmp/review-refused
            jq -e '.error.code == "CONFLICT" and .error.details.reason == "NO_MAYBE_PAIRS"' /tmp/review-refused > /dev/null
            echo "ok: no maybe pairs, the AI review is refused with NO_MAYBE_PAIRS"
          fi

          # Clusters and golden records: a project-level job (payload {}) over the current scores
          # (and the AI's suggestions, when the review ran). Proposals only: status "proposed".
          job=$(curl -sS --fail-with-body -X POST "$api/projects/$project/jobs" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"type":"clustering","payload":{}}' | jq -r '.data.job.id')
          curl -sSN --fail --max-time 90 "$api/jobs/$job/events" -H "$auth" | sed -n 's/^data: //p' > "/tmp/clustering-$job"
          echo "clustering job $job: $(jq -r '"\(.status) \(.progress)% \(.message)"' "/tmp/clustering-$job" | paste -sd ',' -)"
          jq -s -e 'last | .status == "succeeded"' "/tmp/clustering-$job" > /dev/null
          clusters="$api/projects/$project/clusters"
          records=$(jq -r '.data.summary.recordCount' /tmp/candidates-summary)
          curl -sS --fail-with-body "$clusters/summary" -H "$auth" > /tmp/clusters-summary
          jq -c '.data | {outdated, summary: .summary | {recordCount, clusterCount, singletonCount, multiRecordCount, needsReviewCount, aiSuggestedCount, averageSize, largestCluster}}' /tmp/clusters-summary
          jq -e --argjson records "$records" '.data.outdated == false and .data.summary.recordCount == $records
            and .data.summary.singletonCount + .data.summary.multiRecordCount == .data.summary.clusterCount
            and .data.summary.multiRecordCount > 0' /tmp/clusters-summary > /dev/null
          # Every staged record is in exactly one cluster (paged, 100 at a time).
          cursor=""; members=0; seen=0
          while :; do
            curl -sS --fail-with-body "$clusters?limit=100${cursor:+&cursor=$cursor}" -H "$auth" > /tmp/clusters-page
            members=$((members + $(jq '[.data.items[].size] | add // 0' /tmp/clusters-page)))
            seen=$((seen + $(jq '.data.items | length' /tmp/clusters-page)))
            jq -e 'all(.data.items[]; .status == "proposed" and (.memberRecordIds | length) == .size
              and (.members | length) == .size and .goldenRecord.customerId == .customerId)' /tmp/clusters-page > /dev/null
            cursor=$(jq -r '.data.nextCursor // empty' /tmp/clusters-page)
            [ -n "$cursor" ] || break
          done
          echo "clusters listed: $seen, members: $members, staged records: $records"
          test "$members" = "$records"
          test "$seen" = "$(jq -r '.data.summary.clusterCount' /tmp/clusters-summary)"
          # One multi-record cluster in detail: its golden record with provenance (rules only printed).
          customer=$(curl -sS --fail-with-body "$clusters?minSize=2&limit=1" -H "$auth" | jq -r '.data.items[0].customerId')
          curl -sS --fail-with-body "$clusters/$customer" -H "$auth" > /tmp/cluster-detail
          jq -c '.data.cluster | {size, confidence, label, flags, aiSuggested, rules: (.goldenRecord.provenance | map_values(.rule))}' /tmp/cluster-detail
          jq -e '.data.cluster as $c | $c.size >= 2 and ($c.label | IN("High", "Medium", "Low"))
            and $c.goldenRecord.fields.customer_id == $c.customerId
            and ($c.goldenRecord.provenance | length) > 0
            and all($c.goldenRecord.provenance[]; .rule == null or (.recordId as $r | $c.memberRecordIds | index($r) != null))' \
            /tmp/cluster-detail > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' "$clusters?flag=maybe-not" -H "$auth")
          test "$code" = 400
          echo "ok: every record in one proposed cluster; golden records carry provenance"

          # Match Review decisions (ADR 0019): approve all High, approve one, split one record out.
          curl -sS --fail-with-body -X POST "$clusters/approve-high" -H "$auth" \
            -H 'Content-Type: application/json' -d '{}' > /tmp/approve-high
          jq -c '.data' /tmp/approve-high
          jq -e '.data.approved >= 0 and .data.alreadyApproved >= 0' /tmp/approve-high > /dev/null
          curl -sS --fail-with-body -X POST "$clusters/$customer/approve" -H "$auth" \
            -H 'Content-Type: application/json' -d '{}' > /dev/null
          curl -sS --fail-with-body "$clusters/$customer" -H "$auth" > /tmp/cluster-approved
          jq -e '.data.cluster.status == "approved" and .data.cluster.goldenRecord.status == "approved"
            and .data.review.approvedCount >= 1 and all(.data.cluster.links[]; has("evidence"))' \
            /tmp/cluster-approved > /dev/null
          echo "ok: approved $customer ($(jq -r '.data.review.approvedCount' /tmp/cluster-approved) approved in all)"
          record=$(jq -r '.data.cluster.memberRecordIds[0]' /tmp/cluster-detail)
          curl -sS --fail-with-body -X POST "$clusters/$customer/split" -H "$auth" \
            -H 'Content-Type: application/json' -d "{\"recordId\":\"$record\"}" > /tmp/split
          jq -c '.data | {decisionsWritten, job: (.job | {type, status})}' /tmp/split
          job=$(jq -r '.data.job.id' /tmp/split)
          curl -sSN --fail --max-time 90 "$api/jobs/$job/events" -H "$auth" | sed -n 's/^data: //p' > "/tmp/clustering-$job"
          jq -s -e 'last | .status == "succeeded"' "/tmp/clustering-$job" > /dev/null
          # The record now belongs to another customer id (the old membership is gone).
          cursor=""; owner_id=""
          while [ -z "$owner_id" ]; do
            curl -sS --fail-with-body "$clusters?limit=100${cursor:+&cursor=$cursor}" -H "$auth" > /tmp/clusters-page
            owner_id=$(jq -r --arg r "$record" '.data.items[] | select(.memberRecordIds | index($r)) | .customerId' /tmp/clusters-page)
            cursor=$(jq -r '.data.nextCursor // empty' /tmp/clusters-page)
            [ -n "$cursor" ] || break
          done
          echo "record moved from $customer to $owner_id"
          test -n "$owner_id"
          test "$owner_id" != "$customer"
          curl -sS --fail-with-body "$clusters/summary" -H "$auth" | jq -e '.data.summary.decisionCount >= 1' > /dev/null
          echo "ok: split applied by the automatic clustering job"

          # Export golden records (ADR 0020): approve a customer of the new run, then a CSV of the
          # approved customers and an Excel workbook of all of them. Only counts are printed.
          # The largest customer (the split may have left no customer of two records).
          customer=$(curl -sS --fail-with-body "$clusters?limit=1" -H "$auth" | jq -r '.data.items[0].customerId')
          curl -sS --fail-with-body -X POST "$clusters/$customer/approve" -H "$auth" \
            -H 'Content-Type: application/json' -d '{}' > /dev/null
          exports="$api/projects/$project/exports"
          all_customers=$(curl -sS --fail-with-body "$clusters/summary" -H "$auth" | jq -r '.data.summary.clusterCount')
          for spec in 'csv approved text/csv; charset=utf-8' \
            'xlsx all application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'; do
            format=${spec%% *}; rest=${spec#* }; scope=${rest%% *}; type=${rest#* }
            job=$(curl -sS --fail-with-body -X POST "$api/projects/$project/jobs" -H "$auth" \
              -H 'Content-Type: application/json' \
              -d "{\"type\":\"export\",\"payload\":{\"format\":\"$format\",\"scope\":\"$scope\",\"includeSources\":true}}" \
              | jq -r '.data.job.id')
            curl -sSN --fail --max-time 90 "$api/jobs/$job/events" -H "$auth" | sed -n 's/^data: //p' > "/tmp/export-$job"
            echo "export job $job: $(jq -r '"\(.status) \(.progress)% \(.message)"' "/tmp/export-$job" | paste -sd ',' -)"
            jq -s -e 'last | .status == "succeeded"' "/tmp/export-$job" > /dev/null
            export_id=$(jq -s -r 'last | .result.exportId' "/tmp/export-$job")
            curl -sS --fail-with-body "$exports/$export_id" -H "$auth" > /tmp/export-meta
            jq -c '.data.export | {format, scope, rowCount, bytes, filename}' /tmp/export-meta
            rows=$(jq -r '.data.export.rowCount' /tmp/export-meta)
            got=$(curl -sS --fail-with-body -D /tmp/export-headers -o "/tmp/export.$format" \
              -w '%{http_code}|%{content_type}' "$exports/$export_id/download" -H "$auth")
            echo "download: $got, $(wc -c < "/tmp/export.$format") bytes"
            test "$got" = "200|$type"
            test -s "/tmp/export.$format"
            test "$(wc -c < "/tmp/export.$format")" = "$(jq -r '.data.export.bytes' /tmp/export-meta)"
            grep -qi '^content-disposition: attachment; filename="customers-[a-z0-9-]*\.'"$format"'"' /tmp/export-headers
            grep -qi '^x-content-type-options: nosniff' /tmp/export-headers
            grep -qi '^cache-control: no-store' /tmp/export-headers
            if [ "$format" = csv ]; then
              head -n 1 /tmp/export.csv | sed 's/^\xEF\xBB\xBF//' | grep -q '^customer_id,'
              counted=$(python3 -c 'import csv, sys; print(sum(1 for _ in csv.reader(open(sys.argv[1], encoding="utf-8-sig", newline=""))) - 1)' /tmp/export.csv)
              echo "csv rows: $counted (metadata: $rows)"
              test "$counted" = "$rows"
              test "$rows" -ge 1
            else
              test "$(head -c 4 /tmp/export.xlsx | od -An -tx1 | tr -d ' \n')" = 504b0304
              echo "xlsx rows: $rows (customers: $all_customers)"
              test "$rows" = "$all_customers"
            fi
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$api/projects/$project/jobs" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"type":"export","payload":{"format":"pdf"}}')
          test "$code" = 400
          echo "ok: golden records exported to CSV and Excel, downloaded as attachments"

          # SQL agent (ADR 0021): draft the customers query (Mock provider), check its tests,
          # approve it, run it. Only codes and counts are printed, never values.
          sql="$api/projects/$project/sql"
          job=$(curl -sS --fail-with-body -X POST "$api/projects/$project/jobs" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"type":"sql_draft","payload":{"scope":"approved"}}' \
            | jq -r '.data.job.id')
          curl -sSN --fail --max-time 120 "$api/jobs/$job/events" -H "$auth" | sed -n 's/^data: //p' > "/tmp/sql-draft-$job"
          echo "sql_draft job $job: $(jq -r '"\(.status) \(.progress)% \(.message)"' "/tmp/sql-draft-$job" | paste -sd ',' -)"
          jq -s -e 'last | .status == "succeeded" and .result.testsPassed == true' "/tmp/sql-draft-$job" > /dev/null
          version=$(jq -s -r 'last | .result.versionId' "/tmp/sql-draft-$job")
          curl -sS --fail-with-body "$sql/versions/$version" -H "$auth" > /tmp/sql-version
          jq -c '.data.version | {version, status, method, model, validation, tests: (.tests.checks | map({(.name): .status}) | add), rows: .tests.summary.rowCount}' /tmp/sql-version
          jq -e '.data.version.status == "draft" and .data.version.testsPassed == true
            and .data.version.validation.ok == true and all(.data.version.tests.checks[]; .status == "passed")' \
            /tmp/sql-version > /dev/null
          curl -sS --fail-with-body "$sql/versions" -H "$auth" | jq -e --arg v "$version" \
            '.data.items | any(.id == $v) and all(.[]; has("sql") | not)' > /dev/null
          curl -sS --fail-with-body -X POST "$sql/versions/$version/approve" -H "$auth" \
            -H 'Content-Type: application/json' -d '{}' | jq -e '.data.version.status == "approved"' > /dev/null
          job=$(curl -sS --fail-with-body -X POST "$api/projects/$project/jobs" -H "$auth" \
            -H 'Content-Type: application/json' -d "{\"type\":\"sql_run\",\"payload\":{\"versionId\":\"$version\"}}" \
            | jq -r '.data.job.id')
          curl -sSN --fail --max-time 120 "$api/jobs/$job/events" -H "$auth" | sed -n 's/^data: //p' > "/tmp/sql-run-$job"
          echo "sql_run job $job: $(jq -s -c 'last | {status, result: (.result | {passed, rowCount, failedChecks})}' "/tmp/sql-run-$job")"
          jq -s -e 'last | .status == "succeeded" and .result.passed == true and .result.rowCount >= 1' "/tmp/sql-run-$job" > /dev/null
          curl -sS --fail-with-body "$sql/versions/$version" -H "$auth" \
            | jq -e '.data.version.lastRun.passed == true' > /dev/null
          # A second approval of the same version is refused; a bad instruction never starts.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$sql/versions/$version/approve" -H "$auth" \
            -H 'Content-Type: application/json' -d '{}')
          test "$code" = 409
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$api/projects/$project/jobs" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"type":"sql_draft","payload":{"scope":"maybe"}}')
          test "$code" = 400
          echo "ok: SQL drafted, all tests passed, approved and run against the current data"

          # Data quality (ADR 0022): check the approved SQL's table, then change a threshold and
          # check again to see it applied. Only statuses, counts and thresholds are printed.
          quality="$api/projects/$project/quality"
          run_quality() {
            local job
            job=$(curl -sS --fail-with-body -X POST "$api/projects/$project/jobs" -H "$auth" \
              -H 'Content-Type: application/json' -d '{"type":"quality","payload":{}}' | jq -r '.data.job.id') || return 1
            curl -sSN --fail --max-time 120 "$api/jobs/$job/events" -H "$auth" | sed -n 's/^data: //p' > "/tmp/quality-$job" || return 1
            echo "quality job $job: $(jq -s -c 'last | {status, result: (.result | {status, source, rowCount, ruleCount, statusCounts})}' "/tmp/quality-$job")" >&2
            jq -s -e 'last | .status == "succeeded" and (.result.status | IN("pass", "warn", "fail"))
              and .result.ruleCount > 0 and .result.source == "sql_version"' "/tmp/quality-$job" > /dev/null || return 1
            echo "$job"
          }
          first=$(run_quality)
          curl -sS --fail-with-body "$quality/latest" -H "$auth" > /tmp/quality-latest
          jq -c '.data.run | {status, rowCount, ruleCount, statusCounts, results: [.results[] | {rule, field, status}]}' /tmp/quality-latest
          jq -e --arg id "$first" '.data.run.id == $id and .data.run.ruleCount > 0
            and (.data.run.results | any(.rule == "customer_id_unique" and .status == "pass"))
            and all(.data.run.results[]; (.exampleIds | length) <= 10)' /tmp/quality-latest > /dev/null
          curl -sS --fail-with-body "$quality/runs" -H "$auth" | jq -e --arg id "$first" \
            '.data.total >= 1 and .data.items[0].id == $id and all(.data.items[]; has("results") | not)' > /dev/null
          curl -sS --fail-with-body -X PUT "$quality/rules" -H "$auth" -H 'Content-Type: application/json' \
            -d '{"rules":{"validity":{"warn":100,"fail":100}},"fields":{"email":{"warn":100,"fail":null}}}' \
            | jq -e '.data.rules.rules.validity.warn == 100' > /dev/null
          second=$(run_quality)
          curl -sS --fail-with-body "$quality/runs/$second" -H "$auth" > /tmp/quality-second
          jq -c '.data.run | {status, thresholds: [.results[] | select(.rule == "validity" and .status != "skipped") | .threshold] | unique}' /tmp/quality-second
          jq -e '.data.run.config.rules.validity == {"enabled": true, "warn": 100, "fail": 100}
            and all(.data.run.results[] | select(.rule == "validity" and .status != "skipped"); .threshold == {"warn": 100, "fail": 100})
            and (.data.run.results | any(.rule == "completeness_optional" and .field == "email" and .threshold.fail == null))' \
            /tmp/quality-second > /dev/null
          curl -sS --fail-with-body "$quality/latest" -H "$auth" | jq -e --arg id "$second" '.data.run.id == $id' > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT "$quality/rules" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"rules":{"customer_id_unique":{"enabled":false}}}')
          test "$code" = 400
          echo "ok: quality checked, latest report matches, a changed threshold applied on the next run"

          # Dashboard (ADR 0023): its counts agree with the other endpoints. Only counts are printed.
          curl -sS --fail-with-body "$api/projects/$project/dashboard?range=7d" -H "$auth" > /tmp/dashboard
          curl -sS --fail-with-body "$clusters/summary" -H "$auth" > /tmp/clusters-now
          curl -sS --fail-with-body "$quality/latest" -H "$auth" > /tmp/quality-now
          jq -c '.data | {sources: .pipeline.sources.count, customers: .pipeline.clusters.customers,
            approved: .pipeline.clusters.approved, sql: .pipeline.sql.latest.status,
            quality: .pipeline.quality.latest.status, aiCalls: .ai.total.calls,
            qualityRuns: (.quality.runs | length), decisions: .review.total,
            jobs: ([.jobs.byType[].total] | add), nextStep: .pipeline.nextStep.step}' /tmp/dashboard
          jq -e --slurpfile c /tmp/clusters-now --slurpfile q /tmp/quality-now '.data
            | .pipeline.clusters.customers == $c[0].data.summary.clusterCount
            and .pipeline.clusters.approved == $c[0].data.review.approvedCount
            and .pipeline.clusters.outdated == $c[0].data.outdated
            and .pipeline.quality.latest.status == $q[0].data.run.status
            and .pipeline.sql.approvedVersion != null
            and .ai.total.calls >= 0 and (.quality.runs | length) >= 2
            and .review.byType.sql_approve >= 1 and .review.byType.match_approve >= 1
            and all(.benchmarks.items[]; .dataset == "synthetic")' /tmp/dashboard > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' "$api/projects/$project/dashboard?range=1y" -H "$auth")
          test "$code" = 400
          echo "ok: dashboard counts match the clusters, quality and SQL endpoints"

          # Knowledge index (ADR 0024): index the project (Mock embeddings), check the summary,
          # then search it from the api container (the ai-service is internal). Only ids, counts,
          # kinds and titles are printed, never chunk text.
          job=$(curl -sS --fail-with-body -X POST "$api/projects/$project/jobs" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"type":"knowledge_index","payload":{}}' | jq -r '.data.job.id')
          curl -sSN --fail --max-time 180 "$api/jobs/$job/events" -H "$auth" | sed -n 's/^data: //p' > "/tmp/knowledge-$job"
          echo "knowledge_index job $job: $(jq -s -c 'last | {status, result}' "/tmp/knowledge-$job")"
          jq -s -e 'last | .status == "succeeded"' "/tmp/knowledge-$job" > /dev/null
          curl -sS --fail-with-body "$api/projects/$project/knowledge/summary" -H "$auth" > /tmp/knowledge-summary
          jq -c '.data.summary | {chunkCount, chunksByKind, droppedByPrivacyGuard, maskedDocs, mode, embeddingModel, embedded, reused}' /tmp/knowledge-summary
          multi=$(jq -r '.data.summary.multiRecordCount' /tmp/clusters-now)
          jq -e --argjson multi "$multi" '.data.summary | .droppedByPrivacyGuard == 0
            and .mode == "hybrid" and .embeddingModel == "mock-embedding" and .embeddingError == null
            and .chunksByKind.customer == $multi and .chunksByKind.decision > 0
            and .chunksByKind.mapping > 0 and .chunksByKind.quality > 0
            and .chunksByKind.sql > 0 and .chunksByKind.docs > 0' /tmp/knowledge-summary > /dev/null
          $COMPOSE exec -T api node -e '
            const body = { projectId: process.argv[1], query: "Who approved the SQL?", k: 3 };
            fetch("http://ai-service:8000/internal/v1/knowledge/search", {
              method: "POST",
              headers: { "Content-Type": "application/json", "X-Service-Token": process.env.AI_SERVICE_TOKEN },
              body: JSON.stringify(body),
            })
              .then(async (r) => { if (!r.ok) throw new Error(`search answered ${r.status}`); console.log(JSON.stringify(await r.json())); })
              .catch((e) => { console.error(e.message); process.exit(1); });' "$project" > /tmp/knowledge-search
          jq -c '.data | {mode, chunkCount, queryMasked, results: [.results[] | {kind, title, keywordRank, vectorRank}]}' /tmp/knowledge-search
          jq -e '.data.mode == "hybrid" and (.data.results | length) == 3
            and (.data.results | any(.kind == "decision" and (.title | startswith("SQL decision"))))' \
            /tmp/knowledge-search > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$api/projects/$project/jobs" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"type":"knowledge_index","payload":{"full":true}}')
          test "$code" = 400
          echo "ok: knowledge index built with every kind, nothing dropped, internal search answers"

          # Project assistant (ADR 0025): a grounded answer with a citation, a refusal for an
          # unanswerable question and for one holding an email of the samples, all in one
          # conversation. Only flags, counts and kinds are printed, never questions or answers.
          assistant="$api/projects/$project/assistant"
          ask() {
            jq -n --arg q "$1" --arg c "${2:-}" '{question: $q} + (if $c == "" then {} else {conversationId: $c} end)' \
              | curl -sS --fail-with-body -X POST "$assistant/ask" -H "$auth" -H 'Content-Type: application/json' -d @-
          }
          ask "Why did PIN completeness fail?" > /tmp/assistant-1
          jq -c '.data.turn | {answerable, refusalReason, confidence, mode, citations: [.citations[] | {n, kind}]}' /tmp/assistant-1
          jq -e '.data.turn.answerable and (.data.turn.citations | length) >= 1
            and (.data.turn.citations | any(.kind == "quality" or .kind == "docs"))' /tmp/assistant-1 > /dev/null
          conversation=$(jq -r '.data.conversationId' /tmp/assistant-1)
          ask "What is the CEO's salary?" "$conversation" > /tmp/assistant-2
          jq -c '.data.turn | {answerable, refusalReason}' /tmp/assistant-2
          jq -e '.data.turn.answerable == false and (.data.turn.citations | length) == 0' /tmp/assistant-2 > /dev/null
          email=$(grep -oE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' eval/samples/crm_customers.csv | head -1)
          ask "Which customer has the email $email?" "$conversation" > /tmp/assistant-3
          jq -c '.data.turn | {answerable, refusalReason, questionStored: (.question != null)}' /tmp/assistant-3
          jq -e '.data.turn.refusalReason == "personal_data" and .data.turn.question == null' /tmp/assistant-3 > /dev/null
          curl -sS --fail-with-body "$assistant/conversations" -H "$auth" > /tmp/assistant-list
          jq -c '{conversations: (.data.items | length), turns: [.data.items[].turnCount]}' /tmp/assistant-list
          jq -e '(.data.items | length) == 1 and .data.items[0].turnCount == 3' /tmp/assistant-list > /dev/null
          curl -sS --fail-with-body "$assistant/usage" -H "$auth" > /tmp/assistant-usage
          jq -c '.data.usage | {questions, answered, refusals, calls: .model.calls}' /tmp/assistant-usage
          jq -e '.data.usage | .questions == 3 and .refusals.personal_data == 1 and .model.calls >= 1' \
            /tmp/assistant-usage > /dev/null
          echo "ok: assistant answers with a citation, refuses the unanswerable and personal data"

      - name: AI service is not published to the host
        run: |
          if curl -s --max-time 3 http://localhost:8000/internal/v1/health; then
            echo "ai-service must not be reachable from the host" >&2
            exit 1
          fi
          echo "ok: port 8000 is not published"

      - name: Containers run as non-root
        run: |
          for svc in api ai-service web; do
            uid=$($COMPOSE exec -T "$svc" id -u)
            echo "$svc uid=$uid"
            test "$uid" != 0
          done

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JS deps and Playwright Chromium
        run: |
          npm ci --no-audit --no-fund
          cd apps/web && npx playwright install --with-deps chromium

      # Single-origin mode, as on free hosting: the api serves the app with its CSP, and the
      # suite fails on any CSP violation in the browser console (ADR 0027).
      - name: End-to-end tests (Playwright, against the api serving the web app)
        run: npm run e2e --workspace apps/web
        env:
          E2E_BASE_URL: http://localhost:4000

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: Upload screenshots of the web app
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-screenshots
          path: apps/web/test-results/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --timestamps

      - name: Tear down
        if: always()
        run: $COMPOSE down -v --remove-orphans
