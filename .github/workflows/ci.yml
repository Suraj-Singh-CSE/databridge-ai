name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: JS (web + api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real MongoDB and Redis for the api's DB-backed and job event tests. With CI=true they
    # fail instead of skipping.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MONGODB_URI: mongodb://localhost:27017/databridge_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Test web
        run: npm test --workspace apps/web
      - name: Test api with coverage (unit + in-memory + MongoDB suites)
        run: npm run test:coverage --workspace apps/api
      - name: Build api and web
        run: npm run build --workspace apps/api --workspace apps/web

  python:
    name: Python (ai-service)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real Redis (broker + pub/sub) and MongoDB for the in-process Celery worker test.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_MONGODB_URI: mongodb://localhost:27017/databridge_test
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ai-service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest

  eval:
    name: Python (eval generator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            eval/pyproject.toml
            apps/ai-service/pyproject.toml
      # The mapping evaluation imports the ai-service's engine (pure functions, no services).
      - run: pip install -e ../apps/ai-service -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  docker:
    name: Docker (full stack smoke test)
    needs: [js, python]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE: docker compose --env-file .env.ci -f infra/docker-compose.yml
    steps:
      - uses: actions/checkout@v7

      - name: Create CI env file with throwaway random secrets
        run: |
          secret() { openssl rand -base64 48 | tr -d '\n/+='; }
          {
            echo "JWT_ACCESS_SECRET=$(secret)"
            echo "JWT_REFRESH_SECRET=$(secret)"
            echo "AI_SERVICE_TOKEN=$(secret)"
            echo "LLM_PROVIDER=mock"
            echo "LOG_LEVEL=INFO"
            # The e2e suite signs in and out several times from one IP (the nginx proxy).
            echo "AUTH_RATE_LIMIT_MAX=200"
          } > .env.ci

      - name: Validate compose file
        run: $COMPOSE config --quiet

      - name: Build images
        run: $COMPOSE build

      - name: Start stack and wait for health checks
        run: $COMPOSE up -d --wait --wait-timeout 180

      - name: Show image sizes and container status
        run: |
          docker image ls 'databridge-*'
          $COMPOSE ps

      - name: Smoke test
        run: |
          set -euo pipefail
          check() {
            local url=$1 code
            code=$(curl -s -o /tmp/body -w '%{http_code}' --retry 5 --retry-all-errors --retry-delay 2 "$url")
            echo "$url -> $code $(head -c 200 /tmp/body)"
            test "$code" = 200
          }
          check http://localhost:8080/
          check http://localhost:8080/some/client/route   # SPA fallback
          check http://localhost:4000/api/v1/health
          check http://localhost:8080/api/v1/health       # through the nginx proxy
          grep -q '"service":"api"' /tmp/body

      - name: Auth smoke test through the nginx proxy (register, then /me)
        run: |
          set -euo pipefail
          body=$(curl -sf -X POST http://localhost:8080/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","name":"Smoke","password":"smoke-test-password"}')
          echo "$body" | jq -e '.data.user.role == "admin"' > /dev/null
          token=$(echo "$body" | jq -r '.data.accessToken')
          curl -sf http://localhost:8080/api/v1/auth/me -H "Authorization: Bearer $token" \
            | jq -e '.data.user.email == "smoke@example.com"'

      - name: Upload smoke test through the nginx proxy (sources)
        run: |
          set -euo pipefail
          api=http://localhost:8080/api/v1
          token=$(curl -sS --fail-with-body -X POST "$api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-test-password"}' | jq -r '.data.accessToken')
          auth="Authorization: Bearer $token"
          project=$(curl -sS --fail-with-body -X POST "$api/projects" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"name":"Smoke uploads"}' | jq -r '.data.project.id')
          sources="$api/projects/$project/sources"
          echo "project $project"

          csv=$(curl -sS --fail-with-body -X POST "$sources" -H "$auth" \
            -F "file=@eval/samples/crm_customers.csv;type=text/csv" -F name=CRM -F systemName=CRM)
          echo "upload crm_customers.csv -> $(echo "$csv" | jq -c '.data.source | {id, name, format, sizeBytes, rowCount, columnCount, status}')"
          echo "$csv" | jq -e '.data.source.rowCount == 143 and .data.source.columnCount == 10' > /dev/null
          csv_id=$(echo "$csv" | jq -r '.data.source.id')

          xlsx=$(curl -sS --fail-with-body -X POST "$sources" -H "$auth" \
            -F "file=@eval/samples/billing_export.xlsx" -F systemName=Billing)
          echo "upload billing_export.xlsx -> $(echo "$xlsx" | jq -c '.data.source | {id, name, format, sizeBytes, rowCount}')"
          xlsx_id=$(echo "$xlsx" | jq -r '.data.source.id')

          list=$(curl -sS --fail-with-body "$sources" -H "$auth")
          echo "list -> $(echo "$list" | jq -c '[.data.items[] | {name, format, rowCount}]')"
          echo "$list" | jq -e --arg id "$csv_id" \
            '.data.items | map(select(.id == $id and .rowCount == 143)) | length == 1' > /dev/null

          preview=$(curl -sS --fail-with-body "$sources/$csv_id/preview?limit=3" -H "$auth")
          echo "preview csv -> columns $(echo "$preview" | jq -c '.data.columns'), $(echo "$preview" | jq '.data.rows | length') rows"
          echo "$preview" | jq -e '.data.columns[0] == "cust_id" and (.data.rows | length) == 3' > /dev/null
          preview=$(curl -sS --fail-with-body "$sources/$xlsx_id/preview?limit=3" -H "$auth")
          echo "preview xlsx -> columns $(echo "$preview" | jq -c '.data.columns'), $(echo "$preview" | jq '.data.rows | length') rows"
          echo "$preview" | jq -e '.data.columns[0] == "CustomerID" and (.data.rows | length) == 3' > /dev/null

          printf 'MZ not really a program' > /tmp/setup.exe
          code=$(curl -sS -o /tmp/reject -w '%{http_code}' -X POST "$sources" -H "$auth" -F "file=@/tmp/setup.exe")
          echo "upload setup.exe -> $code $(cat /tmp/reject)"
          test "$code" = 400
          jq -e '.error.code == "UNSUPPORTED_FILE"' /tmp/reject > /dev/null

          # Stored on the shared "uploads" volume: written by api, readable (read-only) by ai-service.
          $COMPOSE exec -T api ls -ln "/data/uploads/projects/$project/sources/$csv_id/"
          echo "ai-service reads header: $($COMPOSE exec -T ai-service head -n 1 "/data/uploads/projects/$project/sources/$csv_id/original.csv")"
          if $COMPOSE exec -T ai-service touch /data/uploads/should-fail 2> /dev/null; then
            echo "ai-service must mount uploads read-only" >&2
            exit 1
          fi
          echo "ok: uploads volume is read-only in ai-service"

      - name: Jobs smoke test through the nginx proxy (demo job, live progress, fail, cancel)
        run: |
          set -euo pipefail
          api=http://localhost:8080/api/v1
          token=$(curl -sS --fail-with-body -X POST "$api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-test-password"}' | jq -r '.data.accessToken')
          auth="Authorization: Bearer $token"
          project=$(curl -sS --fail-with-body -X POST "$api/projects" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"name":"Smoke jobs"}' | jq -r '.data.project.id')

          start_job() {
            curl -sS --fail-with-body -X POST "$api/projects/$project/jobs" -H "$auth" \
              -H 'Content-Type: application/json' -d "$1" | jq -r '.data.job.id'
          }
          # Reads the SSE stream until the api ends it (after a terminal status); 60 s at most.
          watch_job() {
            curl -sSN --fail --max-time 60 "$api/jobs/$1/events" -H "$auth" > "/tmp/sse-$1"
            sed -n 's/^data: //p' "/tmp/sse-$1" > "/tmp/frames-$1"
          }
          summary() { jq -r '"\(.status) \(.progress)%"' "/tmp/frames-$1" | paste -sd ',' -; }

          job=$(start_job '{"type":"demo","payload":{"steps":5,"stepMs":200}}')
          watch_job "$job"
          echo "demo $job events: $(summary "$job")"
          grep -q '^event: job$' "/tmp/sse-$job"
          jq -s -e '
            (last | .status == "succeeded" and .progress == 100 and .result.steps == 5)
            and ([.[].progress] as $p | $p == ($p | sort))
            and ([.[] | select(.status == "running") | .progress] | unique | length) >= 2
          ' "/tmp/frames-$job" > /dev/null
          echo "ok: demo job succeeded with increasing progress"

          job=$(start_job '{"type":"demo","payload":{"steps":3,"stepMs":100,"failAtStep":2}}')
          watch_job "$job"
          echo "failing demo $job events: $(summary "$job"), error $(jq -c 'select(.error) | .error' "/tmp/frames-$job")"
          jq -s -e 'last | .status == "failed" and .error.code == "DEMO_STEP_FAILED"' "/tmp/frames-$job" > /dev/null
          echo "ok: failAtStep job failed with the handler's code"

          job=$(start_job '{"type":"demo","payload":{"steps":20,"stepMs":500}}')
          watch_job "$job" &
          watcher=$!
          for _ in $(seq 1 50); do
            progress=$(curl -sS --fail-with-body "$api/jobs/$job" -H "$auth" | jq -r '.data.job.progress')
            [ "$progress" -gt 0 ] && break
            sleep 0.2
          done
          cancel=$(curl -sS --fail-with-body -X POST "$api/jobs/$job/cancel" -H "$auth")
          echo "cancel $job at ${progress}% -> $(echo "$cancel" | jq -c '.data.job | {status, progress}')"
          wait "$watcher"
          echo "cancelled demo $job events: $(summary "$job")"
          jq -s -e 'last.status == "cancelled"' "/tmp/frames-$job" > /dev/null
          sleep 2   # the worker stops at its next step and must not move the job any more
          after=$(curl -sS --fail-with-body "$api/jobs/$job" -H "$auth" | jq -c '.data.job | {status, progress}')
          echo "after 2 s: $after"
          echo "$after" | jq -e --argjson p "$(echo "$cancel" | jq '.data.job.progress')" \
            '.status == "cancelled" and .progress == $p' > /dev/null
          # The worker stops either at its cancel check or when its next progress write is refused.
          $COMPOSE logs --no-color ai-worker > /tmp/worker.log
          grep -E '"event": "job_(started|succeeded|failed|cancelled|no_longer_active)"' /tmp/worker.log | tail -n 8
          grep -F "\"jobId\": \"$job\"" /tmp/worker.log | grep -qE 'job_(cancelled|no_longer_active)'
          echo "ok: cancelled job stopped in the worker"

      - name: Profile smoke test through the nginx proxy (CSV and XLSX, masked values)
        run: |
          set -euo pipefail
          api=http://localhost:8080/api/v1
          token=$(curl -sS --fail-with-body -X POST "$api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-test-password"}' | jq -r '.data.accessToken')
          auth="Authorization: Bearer $token"
          project=$(curl -sS --fail-with-body -X POST "$api/projects" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"name":"Smoke profiles"}' | jq -r '.data.project.id')
          sources="$api/projects/$project/sources"

          profile() {
            local file=$1 source job
            source=$(curl -sS --fail-with-body -X POST "$sources" -H "$auth" -F "file=@$file" | jq -r '.data.source.id')
            job=$(curl -sS --fail-with-body -X POST "$api/projects/$project/jobs" -H "$auth" \
              -H 'Content-Type: application/json' \
              -d "{\"type\":\"profile\",\"payload\":{\"sourceId\":\"$source\"}}" | jq -r '.data.job.id')
            curl -sSN --fail --max-time 90 "$api/jobs/$job/events" -H "$auth" | sed -n 's/^data: //p' > "/tmp/profile-$job"
            echo "$file job $job: $(jq -r '"\(.status) \(.progress)% \(.message)"' "/tmp/profile-$job" | paste -sd ',' -)" >&2
            jq -s -e 'last | .status == "succeeded"' "/tmp/profile-$job" > /dev/null
            curl -sS --fail-with-body "$sources/$source/profile" -H "$auth" > "/tmp/profile-body-$source"
            echo "$source"
          }

          csv=$(profile eval/samples/crm_customers.csv)
          jq -c '.data.source | {status, rowCount, columnCount}' "/tmp/profile-body-$csv"
          jq -c '[.data.columns[] | {column, inferredType}]' "/tmp/profile-body-$csv"
          jq -e '.data.source.status == "profiled" and .data.source.rowCount == 143
            and (.data.columns | length) == 10
            and (.data.columns[] | select(.column == "ph") | .inferredType) == "phone"
            and (.data.columns[] | select(.column == "email_id") | .samples[0]) == "[EMAIL]"' \
            "/tmp/profile-body-$csv" > /dev/null
          # No raw value of the first CRM row reaches the profile.
          for value in "Rudra Shroff" 6376476497 rudra_s860@example.net 14/12/1975; do
            if grep -qF "$value" "/tmp/profile-body-$csv"; then echo "raw value in profile" >&2; exit 1; fi
          done

          xlsx=$(profile eval/samples/billing_export.xlsx)
          jq -c '.data.source | {status, rowCount, columnCount}' "/tmp/profile-body-$xlsx"
          jq -e '.data.source.rowCount == 151 and .data.source.columnCount == 9
            and (.data.columns[] | select(.column == "PAN") | .patterns[0].code) == "pan"' \
            "/tmp/profile-body-$xlsx" > /dev/null
          echo "ok: CSV and XLSX profiled by the worker from the shared volume"

      - name: Mapping smoke test through the nginx proxy (profile, then map the CRM sample)
        run: |
          set -euo pipefail
          api=http://localhost:8080/api/v1
          token=$(curl -sS --fail-with-body -X POST "$api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-test-password"}' | jq -r '.data.accessToken')
          auth="Authorization: Bearer $token"
          project=$(curl -sS --fail-with-body -X POST "$api/projects" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"name":"Smoke mapping"}' | jq -r '.data.project.id')
          source=$(curl -sS --fail-with-body -X POST "$api/projects/$project/sources" -H "$auth" \
            -F "file=@eval/samples/crm_customers.csv" | jq -r '.data.source.id')

          run_job() {
            local type=$1 job
            job=$(curl -sS --fail-with-body -X POST "$api/projects/$project/jobs" -H "$auth" \
              -H 'Content-Type: application/json' \
              -d "{\"type\":\"$type\",\"payload\":{\"sourceId\":\"$source\"}}" | jq -r '.data.job.id')
            curl -sSN --fail --max-time 90 "$api/jobs/$job/events" -H "$auth" | sed -n 's/^data: //p' > "/tmp/$type-$job"
            echo "$type job $job: $(jq -r '"\(.status) \(.progress)% \(.message)"' "/tmp/$type-$job" | paste -sd ',' -)"
            jq -s -e 'last | .status == "succeeded"' "/tmp/$type-$job" > /dev/null
            jq -s -c 'last | .result' "/tmp/$type-$job"
          }

          run_job profile
          run_job mapping
          curl -sS --fail-with-body "$api/projects/$project/sources/$source/mappings" -H "$auth" > /tmp/mappings
          jq -c '[.data.columns[] | {column, target: .suggestion.target, role: .suggestion.role, label: .suggestion.confidenceLabel}]' /tmp/mappings
          jq -e '(.data.columns | length) == 10 and .data.run.method == "hybrid"
            and (.data.columns[] | select(.column == "email_id") | .suggestion
              | .target == "email" and .confidenceLabel == "High")
            and (.data.columns[] | select(.column == "cust_id") | .suggestion.role) == "source_record_id"' \
            /tmp/mappings > /dev/null
          # Bulk-accept the High suggestions, then a second column onto "email" is refused.
          curl -sS --fail-with-body -X POST "$api/projects/$project/sources/$source/mappings/accept-high" \
            -H "$auth" | jq -e '.data.accepted > 0' > /dev/null
          code=$(curl -s -o /tmp/conflict -w '%{http_code}' -X PATCH \
            "$api/projects/$project/sources/$source/mappings/gender" -H "$auth" \
            -H 'Content-Type: application/json' \
            -d '{"decision":"override","role":"field","target":"email"}')
          test "$code" = 409
          # No raw value of the first CRM row reaches the suggestions.
          for value in "Rudra Shroff" 6376476497 rudra_s860@example.net 14/12/1975; do
            if grep -qF "$value" /tmp/mappings; then echo "raw value in mappings" >&2; exit 1; fi
          done
          echo "ok: profile then mapping; email_id -> email (High)"

      - name: Standardise smoke test through the nginx proxy (map, review, standardise the CRM sample)
        run: |
          set -euo pipefail
          api=http://localhost:8080/api/v1
          token=$(curl -sS --fail-with-body -X POST "$api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-test-password"}' | jq -r '.data.accessToken')
          auth="Authorization: Bearer $token"
          project=$(curl -sS --fail-with-body -X POST "$api/projects" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"name":"Smoke standardise"}' | jq -r '.data.project.id')
          source=$(curl -sS --fail-with-body -X POST "$api/projects/$project/sources" -H "$auth" \
            -F "file=@eval/samples/crm_customers.csv" | jq -r '.data.source.id')
          mappings="$api/projects/$project/sources/$source/mappings"

          run_job() {
            local type=$1 job
            job=$(curl -sS --fail-with-body -X POST "$api/projects/$project/jobs" -H "$auth" \
              -H 'Content-Type: application/json' \
              -d "{\"type\":\"$type\",\"payload\":{\"sourceId\":\"$source\"}}" | jq -r '.data.job.id')
            curl -sSN --fail --max-time 90 "$api/jobs/$job/events" -H "$auth" | sed -n 's/^data: //p' > "/tmp/$type-$job"
            echo "$type job $job: $(jq -r '"\(.status) \(.progress)% \(.message)"' "/tmp/$type-$job" | paste -sd ',' -)"
            jq -s -e 'last | .status == "succeeded"' "/tmp/$type-$job" > /dev/null
            jq -s -c 'last | .result' "/tmp/$type-$job" | tee /tmp/last-result
          }

          run_job profile
          run_job mapping
          curl -sS --fail-with-body -X POST "$mappings/accept-high" -H "$auth" | jq -c '.data'

          # Refused early while columns are still pending.
          code=$(curl -s -o /tmp/refused -w '%{http_code}' -X POST "$api/projects/$project/jobs" -H "$auth" \
            -H 'Content-Type: application/json' -d "{\"type\":\"standardise\",\"payload\":{\"sourceId\":\"$source\"}}")
          echo "standardise before review -> $code $(jq -c '.error | {code, details}' /tmp/refused)"
          test "$code" = 409
          jq -e '.error.details.reason == "MAPPING_NOT_APPROVED"' /tmp/refused > /dev/null

          # The phone column must be used; every other pending column is rejected.
          curl -sS --fail-with-body "$mappings" -H "$auth" > /tmp/mappings
          if jq -e '.data.columns[] | select(.column == "ph") | .status == "pending"' /tmp/mappings > /dev/null; then
            curl -sS --fail-with-body -X PATCH "$mappings/ph" -H "$auth" -H 'Content-Type: application/json' \
              -d '{"decision":"override","role":"field","target":"phone","transform":"to_e164_in"}' > /dev/null
          fi
          for column in $(jq -r '.data.columns[] | select(.status == "pending" and .column != "ph") | .column' /tmp/mappings); do
            curl -sS --fail-with-body -X PATCH "$mappings/$column" -H "$auth" \
              -H 'Content-Type: application/json' -d '{"decision":"reject"}' > /dev/null
          done
          curl -sS --fail-with-body "$mappings" -H "$auth" \
            | jq -c '[.data.columns[] | {column, status, target: (.decision.target // .suggestion.target)}]'

          run_job standardise
          jq -e '.rowCount == 143' /tmp/last-result > /dev/null

          staged="$api/projects/$project/sources/$source/staged"
          curl -sS --fail-with-body "$staged?limit=100" -H "$auth" > /tmp/staged
          # Counts and formats only: no staged value is printed.
          jq -c '{summary: .data.summary | {rowCount, rowsWithIssues, issues}, rows: (.data.items | length), nextCursor: .data.nextCursor}' /tmp/staged
          jq -e '.data.source.status == "standardised" and .data.summary.rowCount == 143
            and (.data.items | length) == 100 and .data.nextCursor == "100"
            and ([.data.items[] | .fields.phone | select(. != null)] | length) > 80
            and all(.data.items[] | .fields.phone | select(. != null); test("^\\+91[6-9][0-9]{9}$"))
            and all(.data.items[]; .sourceRecordId != null)' /tmp/staged > /dev/null
          curl -sS --fail-with-body "$staged?limit=100&cursor=100" -H "$auth" \
            | jq -e '(.data.items | length) == 43 and .data.nextCursor == null' > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' "$staged?limit=101" -H "$auth")
          test "$code" = 400
          echo "ok: reviewed mapping applied to all 143 rows; phones are E.164"

          # Candidate pairs: a project-level job (payload {}) over every standardised source.
          job=$(curl -sS --fail-with-body -X POST "$api/projects/$project/jobs" -H "$auth" \
            -H 'Content-Type: application/json' -d '{"type":"candidates","payload":{}}' | jq -r '.data.job.id')
          curl -sSN --fail --max-time 90 "$api/jobs/$job/events" -H "$auth" | sed -n 's/^data: //p' > "/tmp/candidates-$job"
          echo "candidates job $job: $(jq -r '"\(.status) \(.progress)% \(.message)"' "/tmp/candidates-$job" | paste -sd ',' -)"
          jq -s -e 'last | .status == "succeeded" and .result.recordCount == 143' "/tmp/candidates-$job" > /dev/null
          candidates="$api/projects/$project/candidates"
          curl -sS --fail-with-body "$candidates/summary" -H "$auth" > /tmp/candidates-summary
          jq -c '.data | {outdated, summary: .summary | {recordCount, pairCount, reductionRatio, oversizeBlocksSkipped, pairsByKey}}' /tmp/candidates-summary
          jq -e '.data.outdated == false and .data.summary.recordCount == 143
            and .data.summary.pairCount > 0 and .data.summary.reductionRatio > 0.99' /tmp/candidates-summary > /dev/null
          curl -sS --fail-with-body "$candidates?limit=100" -H "$auth" > /tmp/candidates
          # Shape and formats only: no record value is printed.
          jq -c '{pairs: (.data.items | length), keys: [.data.items[].keys], nextCursor: .data.nextCursor}' /tmp/candidates
          jq -e '(.data.items | length) > 0
            and all(.data.items[]; (.keys | length) > 0 and .recordA.id < .recordB.id
              and .recordA.sourceName == "crm_customers" and (.recordA.fields | type) == "object"
              and (.recordB.fields.phone == null or (.recordB.fields.phone | test("^\\+91[6-9][0-9]{9}$"))))' \
            /tmp/candidates > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' "$candidates?limit=101" -H "$auth")
          test "$code" = 400
          echo "ok: candidate pairs found and listed side by side"

      - name: AI service is not published to the host
        run: |
          if curl -s --max-time 3 http://localhost:8000/internal/v1/health; then
            echo "ai-service must not be reachable from the host" >&2
            exit 1
          fi
          echo "ok: port 8000 is not published"

      - name: Containers run as non-root
        run: |
          for svc in api ai-service ai-worker web; do
            uid=$($COMPOSE exec -T "$svc" id -u)
            echo "$svc uid=$uid"
            test "$uid" != 0
          done

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JS deps and Playwright Chromium
        run: |
          npm ci --no-audit --no-fund
          cd apps/web && npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright, against the compose stack)
        run: npm run e2e --workspace apps/web
        env:
          E2E_BASE_URL: http://localhost:8080

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: Upload screenshots of the web app
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-screenshots
          path: apps/web/test-results/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --timestamps

      - name: Tear down
        if: always()
        run: $COMPOSE down -v --remove-orphans
