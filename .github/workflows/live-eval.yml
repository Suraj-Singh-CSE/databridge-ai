name: Live mapping eval

# Manual only: calls the real model (Gemini) on synthetic data (the committed samples and the
# unseen-header holdout). Never runs on push or pull request; regular CI uses the Mock provider.
# Needs the repository secret GEMINI_API_KEY. See ADR 0013 and README "Evaluating mapping accuracy".
on:
  workflow_dispatch:
    inputs:
      model:
        description: Gemini model name
        type: string
        default: gemini-3.5-flash-lite
        required: true
      max_calls:
        description: Most provider calls this run may make, retries included
        type: number
        default: 30
        required: true
      thinking_level:
        description: Gemini thinking level (default = the model's own; use low for 3 Flash models)
        type: choice
        options: [default, low, minimal, medium, high]
        default: default
      timeout_seconds:
        description: Timeout per provider attempt, in seconds
        type: number
        default: 90
      columns_per_call:
        description: Columns per mapping call (1-40); smaller calls answer faster
        type: number
        default: 12
      requests_per_minute:
        description: Most provider calls per minute, retries included (Flash Lite free tier allows 15; 0 = no pacing)
        type: number
        default: 12

concurrency:
  group: live-eval
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-eval:
    name: Live mapping eval (${{ inputs.model }})
    runs-on: ubuntu-latest
    # Worst case: every one of max_calls attempts runs into the timeout.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            eval/pyproject.toml
            apps/ai-service/pyproject.toml
      - run: pip install -e ../apps/ai-service -e .

      - name: Run the live evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ inputs.model }}
          MAX_CALLS: ${{ inputs.max_calls }}
          THINKING_LEVEL: ${{ inputs.thinking_level }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          COLUMNS_PER_CALL: ${{ inputs.columns_per_call }}
          REQUESTS_PER_MINUTE: ${{ inputs.requests_per_minute }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::Repository secret GEMINI_API_KEY is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ "$THINKING_LEVEL" = "default" ]; then THINKING_LEVEL=""; fi
          status=0
          python -m dbeval.live_mapping_eval --provider gemini --model "$MODEL" \
            --max-calls "$MAX_CALLS" --thinking-level "$THINKING_LEVEL" \
            --timeout-seconds "$TIMEOUT_SECONDS" --columns-per-call "$COLUMNS_PER_CALL" \
            --requests-per-minute "$REQUESTS_PER_MINUTE" \
            --out "$RUNNER_TEMP/live-eval-report" || status=$?
          if [ -f "$RUNNER_TEMP/live-eval-report/live_mapping_report.md" ]; then
            cat "$RUNNER_TEMP/live-eval-report/live_mapping_report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-eval-report
          path: ${{ runner.temp }}/live-eval-report
          if-no-files-found: ignore
